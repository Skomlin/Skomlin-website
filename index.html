g structure of Proust's masterpiece In Search of Lost Time. Swann owner of large estate and at ease in Parisian high society falls obsessively and publicly in love with the courtesan Odette.","keywords":"a consuming jealous love; Charles Swann and Odette; Belle Epoque Paris society; a self-contained Proust for new readers; obsession, memory and desire; In Search of Lost Time","review_quotes":"<p>“No one will get more out of reading<em> Du Cote de chez Swann </em>in French than … reading Swann’s Way in English.”</p><p><strong>John Middleton Murray </strong></p><p></p>","us_list":"21.95","contributors":[{"name":"Proust, Marcel","role":"Author","bio":"Marcel Proust (1871-1922) was a French novelist whose seven-volume In Search of Lost Time is among the supreme achievements of twentieth-century literature. Born in Auteuil, Paris, he devoted his later years almost entirely to the novel. 'Swann in Love', a self-contained section of Swann's Way, traces a consuming, jealous passion in fashionable Paris.","slug":"proust-marcel"},{"name":"Scott Moncrieff, Charles Kenneth","role":"Translator","bio":null,"slug":"scott-moncrieff-charles-kenneth"}],"slug":"swann-in-love","uk_list":"14.95","aus_list":"29.95","eur_list":"17.95"},{"isbn":"9780648238898","title":"King Lear of the Steppes","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"114","bisac":"FICTION / Classics","full_description":"<p>A decidedly Russian adaptation of Shakespeare's tragedy <em>King Lear</em> set in the countryside. It concerns the disrespectful treatment the protagonist Kharlov receives from his ungrateful daughters and the revenge he eventually wreaks upon them.</p>","short_description":"A decidedly Russian adaptation of Shakespeare's tragedy King Lear set in the countryside. It concerns the disrespectful treatment the protagonist Kharlov receives from his ungrateful daughters and the revenge he wreaks upon them.","keywords":"a Russian Lear on the steppe; a landowner divides his estate; peasant tragedy in old Russia; fathers, daughters and betrayal; Turgenev's rural fiction; Ivan Turgenev","review_quotes":null,"us_list":"13.95","contributors":[{"name":"Turgenev, Ivan","role":"Author","bio":"Ivan Turgenev (1818-1883) was a Russian novelist, short-story writer and playwright, the first Russian author to win wide fame across Europe. Born in Oryol into a wealthy landowning family, he spent much of his life in France and Germany and counted Flaubert and the Goncourts among his friends. His major works include Fathers and Sons and A Sportsman's Sketches. Skomlin also publishes Turgenev's The Diary of a Superfluous Man.","slug":"turgenev-ivan"},{"name":"Garnett, Constance","role":"Translator","bio":null,"slug":"garnett-constance"}],"slug":"king-lear-of-the-steppes","uk_list":"9.95","aus_list":"18.95","eur_list":"13.95"},{"isbn":"9780648252115","title":"The Diary of a Superfluous Man","imprint":"Skomlin","series":"Fabulous Novellas","format":"Perfect Bound","page_count":"68","bisac":"FICTION / Classics","full_description":"<p>Turgenev’s iconic tale of love and mortality set in 19th century Tsarist Russia is a skillfully written sad story of heartache and unrequited love. It is also is one of literature's finest portraits of alienation loss and hopelessness.</p>","short_description":"Turgenev's iconic tale of love and mortality set in 19th century Tsarist Russia is a skillfully written sad story of heartache and unrequited love. It is also is one of literature's finest portraits of alienation loss and hopelessness.","keywords":"the original 'superfluous man'; a dying man's confession; unrequited love and regret; a portrait of Russian ennui; a life that came to nothing; Ivan Turgenev","review_quotes":null,"us_list":"12.0","contributors":[{"name":"Turgenev, Ivan","role":"Author","bio":"Ivan Turgenev (1818-1883) was a Russian novelist, short-story writer and playwright, the first Russian author to win wide fame across Europe. Born in Oryol into a wealthy landowning family, he spent much of his life in France and Germany and counted Flaubert and the Goncourts among his friends. His major works include Fathers and Sons and A Sportsman's Sketches. Skomlin also publishes Turgenev's King Lear of the Steppes.","slug":"turgenev-ivan"},{"name":"Garnett, Constance","role":"Translator","bio":null,"slug":"garnett-constance"}],"slug":"the-diary-of-a-superfluous-man"},{"isbn":"9780648252139","title":"The City of the Discreet","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"356","bisac":"FICTION / Classics","full_description":"<p><em>The City of the Discreet</em> is set in the traditional Andalusia of the 19<sup>th </sup>century.  This gentle parody with its vast gallery of characters demonstrates Baroja’s powers of description and his subtle humour. The description of his Cordova and its environs are an invaluable guide to a recent but now lost city.</p>","short_description":"The City of the Discreet is set in the traditional Andalusia of the 19th century. This gentle parody with its vast gallery of characters demonstrates Baroja's powers of description and his subtle humour. The description of his Cordova and its environs are an invaluable guide to a recent but now lost city.","keywords":"intrigue in old Cordoba; a young man among schemers; the Spanish Generation of '98; Andalusian society and politics; a restless picaresque; Pio Baroja in English","review_quotes":"<p>\"Allow me to pay this small tribute to you who taught so much to those of us who wanted to be writers when we were young. I deplore the fact that you have not yet received a Nobel Prize especially when it was given to so many who deserved it less like me who am only an adventurer.\"</p><p><strong>Ernest Hemingway</strong></p><p></p><p>“ …outside of Russia there has never been a novelist so taken up with all that society and respectability reject as Pío Baroja.”</p><p><strong>John Dos Passos </strong></p><p></p><p>“I have never hidden my admirations in literature. They have been and are Dickens Balzac Poe Dostoievski and now Stendhal....”</p><p><strong>Pío Baroja</strong></p><p></p>","us_list":"23.95","contributors":[{"name":"Baroja, Pío","role":"Author","bio":"Pio Baroja (1872-1956) was a Basque-Spanish novelist, a central figure of Spain's 'Generation of '98' whom Hemingway openly admired. Born in San Sebastian, he wrote spare, restless fiction of Spanish life across dozens of novels. The City of the Discreet is set among the schemers and dreamers of Cordoba.","slug":"baroja-p-o"},{"name":"Fassett, Jacob","role":"Translator","bio":null,"slug":"fassett-jacob"}],"slug":"the-city-of-the-discreet","uk_list":"16.95","aus_list":"33.95","eur_list":"20.95"},{"isbn":"9780648252153","title":"The Secret Child","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"162","bisac":"FICTION / Historical / General","full_description":"<p>Jean-Michel Olivier’s novel <em>L’Enfant secret</em> winner of the Swiss Dentan prize is a profound exploration of those secrets we all inherit as part of our DNA. It is a foray into the hidden deeds and misdeeds of our ancestors about which we know little but sometimes discover through the inadvertent confession of a distant cousin or a box of photos.</p><p>The <em>Secret Child</em> narrator attributes his becoming an artist to life experiences inherited from his grandparents.  Set in Trieste during its transition from Austrian to Italian rule after WWI the narrative includes cameo appearances by James and Nora Joyce Ezra Pound and Vladimir Nabokov.  But the central episodes of this memoir-novella concern Olivier’s maternal grandfather né Anton Buchacher who transforms himself into Antonio Campofaggi and whose artful photographic images help metamorphose Benito Mussolini into <em>Il Duce</em>.  Oliver’s own impressionistic “images” are a self-conscious anagram/metaphor for “magic ” which equally epitomizes the translator’s feat of legerdemain in rendering the author’s lyrical style in English—a challenge Laurence Moscato meets with remarkable success</p>","short_description":"Winner of the Swiss Prix Dentan, Jean-Michel Olivier's novel is a haunting excavation of the secrets we inherit in our DNA - the hidden deeds of ancestors we glimpse only through a distant cousin's confession or a box of old photographs. Set in Trieste as the city passes from Austrian to Italian hands after the First World War, it moves among cameo appearances by James and Nora Joyce, Ezra Pound and Vladimir Nabokov.","keywords":"a hidden child's story; buried Swiss family secrets; contemporary French-language fiction; concealment and inheritance; a novel of identity; Jean-Michel Olivier","review_quotes":null,"us_list":"18.95","contributors":[{"name":"Olivier, Jean-Michel","role":"Author","bio":"Jean-Michel Olivier (born 1952 in Nyon, Vaud) is a Swiss novelist, journalist and teacher who studied literature at the University of Geneva under Jean Starobinski and Michel Butor. The author of some twenty novels alongside essays and poetry, he won the Prix Interallie in 2010 for L'Amour negre - a rare Swiss recipient of a major French literary prize. Since 2006 he has directed the Poche Suisse collection at Editions L'Age d'Homme.","slug":"olivier-jean-michel"},{"name":"Moscato, Laurence","role":"Translator","bio":"Laurence Moscato is a professor of translation studies in California and a literary translator working from French into English. Her English translation of Jean-Michel Olivier's Prix Dentan-winning L'Enfant secret, published as The Secret Child (Skomlin, 2018) with a preface by the scholar Clorinda Donato, was praised for its deft rendering of the author's lyrical prose.","slug":"moscato-laurence"},{"name":"Donato, Clorinda","role":"Editor","bio":null,"slug":"donato-clorinda"}],"slug":"the-secret-child","uk_list":"15.95","aus_list":"23.95","eur_list":"15.95"},{"isbn":"9781789265811","title":"Derborence: Where the devils came down","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"116","bisac":"FICTION / Literary","full_description":"<p><strong>A mountain falls down and an alpine village is frozen in its summer state. When a ghostly figure appears beyond the last house the villagers are terrorised. Is it a soul trapped in limbo come to make his baleful complaint? Only one of them recognises him as a survivor her husband in flesh and blood. The village rejoices but when the survivor declares his intention to return beneath the rubble the old doubts resurface. Swiss writer Charles-Ferdinand Ramuz sets his masterful tale of love and loss against the tectonic indifference of the high Alps.</strong></p>","short_description":"A mountain falls down and an alpine village is frozen in its summer state. When a ghostly figure appears the villagers are terrorised. Is it a soul trapped in limbo come to make his baleful complaint? Swiss writer Charles-Ferdinand Ramuz sets his masterful tale of love and loss against the tectonic indifference of the high Alps.","keywords":"a rockfall buries an Alpine valley; a man returns from the mountain; Swiss peasant tragedy; love against the landscape; the Derborence disaster; Charles-Ferdinand Ramuz","review_quotes":null,"us_list":"17.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Spinney, Laura","role":"Translator","bio":"Laura Spinney is a British science journalist and novelist based in Paris. She is the author of the international bestseller Pale Rider: The Spanish Flu of 1918 and How It Changed the World, translated into more than twenty languages, and of Proto: How One Ancient Language Went Global (2025), as well as two novels, The Doctor and The Quick. Her writing appears in National Geographic, Nature, The Economist and The Guardian.","slug":"spinney-laura"}],"slug":"derborence-where-the-devils-came-down","uk_list":"12.95","aus_list":"22.95","eur_list":"15.95"},{"isbn":"9780648252184","title":"Farinet's Gold","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"188","bisac":"FICTION / Literary","full_description":"<p>The old man Sage taught Maurice Farinet many things and one of them was the location of a secret vein of gold. After Sage died Farinet began to make coins. This story commences with Farinet’s second escape from prison hiding from the police in his beloved mountains aided and abetted by the locals in particular the waitress Josephine.  It was she who smuggled file and rope into prison for him.  But the law closes in and Farinet understands he cannot stay an outlaw forever. When a local offical brings him an offer from the government – to turn himself in and serve just six months Farinet has to consider.  Based on a true story Ramuz tells an extraordinary tale of mountains and villages of independence and the price of freedom.</p>","short_description":"The old man Sage taught Maurice Farinet many things and one of them was the location of a secret vein of gold. After Sage died Farinet began to make coins. Based on a true story Ramuz tells an extraordinary tale of mountains and villages of independence and the price of freedom.","keywords":"a Valais counterfeiter and folk hero; forbidden gold in the mountains; an outlaw against the state; a Swiss Alpine legend; freedom, money and myth; Charles-Ferdinand Ramuz","review_quotes":null,"us_list":"18.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Weeks, John","role":"Translator","bio":"John Weeks studied French, Russian and Polish at Amherst College and holds a doctorate in Slavic languages and literatures from the University of California, Berkeley, where he later taught Polish following a Fulbright fellowship in Poland. He has translated widely from Russian and Polish; Farinet's Gold is his first published literary translation.","slug":"weeks-john"}],"slug":"farinet-s-gold","uk_list":"14.95","aus_list":"25.95","eur_list":"18.95"},{"isbn":"9780987153203","title":"Royal Highness","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"336","bisac":"FICTION / Historical / General","full_description":"<p>The ironic satire of a decaying German duchy and its rejuvenation by the appearance of an independent-minded American woman. Peopled with a range of characters from aristocrat to mad woman this novel is a microcosm of Europe before the Great War. The book's driving force is the development of a love between the young Prince hidebound by tradition and the exotic beautiful Imma. Written by Nobel Prize winning author Thomas Mann his careful depiction of a decaying society rejuvenated by modern forces illustrates in fable what he regarded as a universal truth - that ripeness and death are a necessary condition of rebirth.</p>","short_description":"The ironic satire of a decaying German duchy and its rejuvenation by the appearance of an independent-minded American woman. Peopled with a range of characters from aristocrat to mad woman this novel is a microcosm of Europe before the Great War.","keywords":"a prince and an American heiress; gentle satire of a German court; duty versus love; a fairy-tale of modern royalty; early Thomas Mann; a Nobel laureate's romance","review_quotes":null,"us_list":"22.95","contributors":[{"name":"Mann, Thomas","role":"Author","bio":"Thomas Mann (1875-1955) was a German novelist and Nobel laureate (1929), author of Buddenbrooks, The Magic Mountain and Death in Venice. Born in Lubeck, he went into exile after 1933 in opposition to Nazism. Royal Highness (1909), his second novel, is a gently ironic romance set in a minor German principality.","slug":"mann-thomas"}],"slug":"royal-highness","uk_list":"15.95","aus_list":"33.95","eur_list":"20.95"},{"isbn":"9780987153234","title":"Rosinante to the Road Again","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"140","bisac":"FICTION / Classics","full_description":"<p>The title of John Dos Passos' evocative early novel alludes to Don Quixote’s horse in that most celebrated of Spanish novels that follows the adventures of a wandering dreamer. Dos Passos spins a tale of two travellers making their way by foot from Madrid to Toledo in post-World War I Spain. Along the way they encounter simple earthy folk on the trail and in taverns providing a convenient backdrop for Dos Passos's observations on the tension between old agrarian ways and new industrial imperatives. Dos Passos interweaves the story with chapters about the finest Hispanic poets and novelists of the day. One of his earliest books and a most poetic use of the English language.</p>","short_description":"The title alludes to Don Quixote's horse. Dos Passos spins a tale of two travellers making their way by foot from Madrid to Toledo in post-World War I Spain. Dos Passos interweaves the story with chapters about the finest Hispanic poets and novelists of the day. One of his earliest books and a most poetic use of language.","keywords":"travels through Spain; essays on the Spanish spirit; Don Quixote and the open road; a young American in Iberia; landscape, culture and wandering; John Dos Passos","review_quotes":null,"us_list":"14.95","contributors":[{"name":"Dos Passos, John","role":"Author","bio":"John Dos Passos (1896-1970) was an American novelist and one of the foremost chroniclers of the modern age, best known for his U.S.A. trilogy. Born in Chicago, he served as a volunteer ambulance driver in the First World War and travelled widely in Europe. Skomlin also publishes Dos Passos's One Man's Initiation: 1917.","slug":"dos-passos-john"}],"slug":"rosinante-to-the-road-again","uk_list":"12.95","aus_list":"19.95","eur_list":"14.95"},{"isbn":"9780987153227","title":"One Man's Initiation: 1917","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"98","bisac":"FICTION / Classics","full_description":"<p>One Man's Initiation-1917 \"the greatest writer of our time\" Jean-Paul Sartre John Dos Passos' first novel a barely disguised autobiography of his withering experiences in France in 1917 was written from diaries he kept when a volunteer in the Norton-Harjes Ambulance Corps the Red Cross and finally the American Army. A series of sharp vivid disconnected impressions written with beautiful powerful simplicity conveying the urgency and immediacy of a flowing stream of events. Powerful descriptions of suffering broken bodies squalor and disintegration are juxtaposed with extraordinarily acute descriptions of beauty. It was published in 1920 by Allen & Unwin with Dos Passos contributing to publication costs. In the first six months it sold only 63 copies. Were it not for the success of his next novel Three Soldiers it may never have been republished.</p>","short_description":"Drawing on the diaries he kept as a volunteer ambulance driver on the Western Front, Dos Passos's first novel sets the squalor and broken bodies of 1917 against sudden, piercing glimpses of beauty.","keywords":"a volunteer ambulance driver on the Western Front; the squalor and beauty of 1917; a first novel drawn from war diaries; the Great War in sharp impressions; a young American at the front; John Dos Passos","review_quotes":null,"us_list":"14.95","contributors":[{"name":"Dos Passos, John","role":"Author","bio":"John Dos Passos (1896-1970) was an American novelist and one of the foremost chroniclers of the modern age, best known for his U.S.A. trilogy. Born in Chicago, he served as a volunteer ambulance driver in the First World War and travelled widely in Europe. Skomlin also publishes Dos Passos's Rosinante to the Road Again.","slug":"dos-passos-john"}],"slug":"one-man-s-initiation-1917","uk_list":"10.95","aus_list":"18.95","eur_list":"12.95"},{"isbn":"9780987153241","title":"The Comedienne","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"288","bisac":"FICTION / Classics","full_description":"<p>The Comédienne draws on Nobel Prize winner Wladyslav Reymont's own experiences as an actor in a struggling provincial theatre at the fin de siecle at time of massive social upheaval in Europe. Reymont depicts in a slow burning tragedy a young provincial Janina the comédienne of the title who joins a Warsaw theatre company and struggles toward what was then a very modern notion of personal freedom. A 'Comédienne' also played drama and tragedy and the word in Polish had some connotation of a deceiver. As such the title in Reymont's day would have implied a somewhat darker novel that we might unwittingly expect today.</p><p>This edition has been completely re-edited and includes over 500 amendments corrections and new translations to the orignal text. The introduction by Marianna Rychlowska includes;</p>\n<ul>\n\t<li>Biographical details of the author</li>\n\t<li>Historical context of the book</li>\n\t<li>Literary notes</li>\n\t<li>Historical review of early theatre in Poland</li>\n\t<li>Theatre reportage by Henryk Sienkiewicz</li>\n</ul>\n\n<p>These unique insights provide the contemporary reader with much of the commonly understood historical context that was assumed of the original audience.</p>","short_description":"Reymont describes in a slow burning tragedy a young provincial Janina the comédienne of the title who joins a Warsaw theatre company and contends with what was then a very modern notion of personal freedom.","keywords":"a young woman joins a travelling theatre; provincial stage life in old Poland; dreams of the stage and disillusion; ambition, love and the actor's world; a Nobel laureate's early novel; Wladyslaw Reymont","review_quotes":null,"us_list":"20.95","contributors":[{"name":"Reymont, Wladyslaw Stanislaw","role":"Author","bio":"Wladyslaw Reymont (1867-1925) was a Polish novelist and Nobel laureate (1924), best known for his four-volume epic The Peasants. Born near Kobiele Wielkie, he worked as an actor and a railway official before turning to writing. The Comedienne (1896) draws on his own experience of the provincial theatre.","slug":"reymont-wladyslaw-stanislaw"},{"name":"Obecny, Edmund","role":"Translator","bio":null,"slug":"obecny-edmund"},{"name":"Rychlowska, Marianna","role":"Introduction by","bio":null,"slug":"rychlowska-marianna"}],"slug":"the-comedienne","uk_list":"14.95","aus_list":"30.95","eur_list":"18.95"},{"isbn":"9780987153258","title":"Pierre and Luce","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"86","bisac":"FICTION / Classics","full_description":"French writer Romain Rolland was one of the great pacifists of the twentieth century. Winner of the Nobel Prize for Literature in 1915 he wrote this tragic story at the end of World War I. In Pierre and Luce he describes a tender first love between two Parisians in an achingly sad indictment of war.","short_description":"In wartime Paris, two young strangers fall tenderly in love beneath the falling bombs. Written at the close of the First World War by the Nobel laureate and pacifist Romain Rolland, it is a brief, achingly sad indictment of war.","keywords":"wartime first love in Paris; two young lovers under the bombs; a pacifist's tragic romance; tenderness against catastrophe; the Great War and the innocent; a Nobel laureate's novel","review_quotes":null,"us_list":"14.95","contributors":[{"name":"Rolland, Romain","role":"Author","bio":"Romain Rolland (1866-1944) was a French novelist, dramatist and Nobel laureate (1915), a committed pacifist best known for the ten-volume Jean-Christophe. Born in Clamecy, he wrote Pierre and Luce during the First World War as a protest against its slaughter.","slug":"rolland-romain"},{"name":"de Kay, Charles","role":"Translator","bio":null,"slug":"de-kay-charles"}],"slug":"pierre-and-luce","uk_list":"10.95","aus_list":"17.95","eur_list":"14.95"},{"isbn":"9780987153289","title":"Hell","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"136","bisac":"FICTION / Classics","full_description":"Hell (L'enfer) is a study of voyeurism written in 1908 by Henri Barbusse. When it was translated into English in 1918 it ignited a scandal. A young man in a Paris boarding house spies on the inhabitants of the next room through a hole in the wall. At once both voyeur and philosopher what becomes of him who sees too much? Witnessing love marriage adultery incest death and seeing the heroism and cowardice of the human condition. In his words \"We are divinely alone the heavens have fallen on our heads\".","short_description":"From a Paris boarding-house room, a young man watches the lives next door through a hole in the wall - love, marriage, adultery, death. Barbusse's scandalous 1908 novel asks what becomes of the man who sees too much.","keywords":"a voyeur at the boarding-house wall; watching life through a peephole; love, death and desire observed; a scandalous 1908 novel; the man who sees too much; Henri Barbusse","review_quotes":null,"us_list":"14.95","contributors":[{"name":"Barbusse, Henri","role":"Author","bio":"Henri Barbusse (1873-1935) was a French novelist and journalist, best known for Under Fire (Le Feu, 1916), his searing novel of the trenches which won the Prix Goncourt. Born in Asnieres-sur-Seine, he was a committed pacifist and, later, a communist. Hell (L'Enfer, 1908) preceded his war writing.","slug":"barbusse-henri"},{"name":"O'Brien, Edward J.","role":"Translator","bio":null,"slug":"o-brien-edward-j"}],"slug":"hell","uk_list":"12.95","aus_list":"19.95","eur_list":"14.95"}]</script>
<script id="contributor-data" type="application/json">{"tanska-hoffman-klementyna": {"name": "Tanska Hoffman, Klementyna", "bio": "Klementyna Tanska Hoffmanowa (1798-1845) was a Polish writer and educator, among the first women in Poland to earn her living by the pen. Born in Warsaw, she wrote widely for young readers and on the moral education of women; The Journal of Countess Francoise Krasinska (1825), an imagined diary of an eighteenth-century Polish noblewoman, is her best-known work and an early example of the historical-diary novel.", "roles": ["Author"], "books": [{"title": "The Journal of Countess Francoise Krasinska", "slug": "the-journal-of-countess-francoise-krasinska", "role": "Author"}]}, "rychlowska-marianna": {"name": "Rychlowska, Marianna", "bio": null, "roles": ["Introduction by"], "books": [{"title": "The Journal of Countess Francoise Krasinska", "slug": "the-journal-of-countess-francoise-krasinska", "role": "Introduction by"}, {"title": "The Comedienne", "slug": "the-comedienne", "role": "Introduction by"}]}, "stein-alex": {"name": "Stein, Alex", "bio": "Alex Stein is an American essayist, aphorist and illustrator. His books include Made-Up Interviews with Imaginary Artists (Ugly Duckling Presse, 2009) - a genre-blurring collection of interviews, interview fictions and essays on the art of the interview - and Weird Emptiness: Essays and Aphorisms (Wings Press, 2007). He lives in Boulder and works at the University of Colorado.", "roles": ["Author"], "books": [{"title": "The Artist as Mystic: Conversations with Yahia Lababidi", "slug": "the-artist-as-mystic-conversations-with-yahia-lababidi", "role": "Author"}]}, "lababidi-yahia": {"name": "Lababidi, Yahia", "bio": "Yahia Lababidi is an Egyptian-American poet, essayist and aphorist, the author of some sixteen books of poetry and prose. His first collection of aphorisms, Signposts to Elsewhere, was named a 2008 Book of the Year by The Independent (UK), and his work appears in World Literature Today, AGNI and Philosophy Now, as well as in Geary's Guide to the World's Great Aphorists. In 2012 he served as a juror for the Neustadt Prize, one of the most prestigious international literary awards.", "roles": ["Author"], "books": [{"title": "The Artist as Mystic: Conversations with Yahia Lababidi", "slug": "the-artist-as-mystic-conversations-with-yahia-lababidi", "role": "Author"}]}, "pickthall-marmaduke": {"name": "Pickthall, Marmaduke", "bio": "Marmaduke Pickthall (1875-1936) was an English novelist, journalist and traveller, later celebrated for his translation The Meaning of the Glorious Koran (1930). Born in London, he travelled extensively in the Near East as a young man and converted to Islam in 1917. His fiction and memoirs drew on a deep sympathy for Arab and Ottoman life.", "roles": ["Author"], "books": [{"title": "Oriental Encounters", "slug": "oriental-encounters", "role": "Author"}]}, "ramuz-charles-ferdinand": {"name": "Ramuz, Charles Ferdinand", "bio": "Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.", "roles": ["Author"], "books": [{"title": "Beauty on Earth", "slug": "beauty-on-earth", "role": "Author"}, {"title": "The Reign of the Evil One", "slug": "the-reign-of-the-evil-one", "role": "Author"}, {"title": "Riversong of the Rhône", "slug": "riversong-of-the-rho-ne", "role": "Author"}, {"title": "What if the sun...", "slug": "what-if-the-sun", "role": "Author"}, {"title": "Derborence: Where the devils came down", "slug": "derborence-where-the-devils-came-down", "role": "Author"}, {"title": "Farinet's Gold", "slug": "farinet-s-gold", "role": "Author"}]}, "bailat-jones-michelle": {"name": "Bailat-Jones, Michelle", "bio": "Michelle Bailat-Jones is a writer and translator. Born in Japan and raised in the Pacific Northwest, she lives in Switzerland, of which she is now a citizen, and holds an MFA from Emerson College. Her debut novel Fog Island Mountains won the 2013 Christopher Doheny Award from the Center for Fiction; her second, Unfurled, appeared in 2018. She is Translations Editor at Necessary Fiction, and beyond her two Ramuz novels for Skomlin she has translated Claude Cahun and, for Bloomsbury, Corinne Chaponniere's biography of Red Cross founder Henry Dunant.", "roles": ["Translator"], "books": [{"title": "Beauty on Earth", "slug": "beauty-on-earth", "role": "Translator"}, {"title": "What if the sun...", "slug": "what-if-the-sun", "role": "Translator"}]}, "trueblood-valerie": {"name": "Trueblood, Valerie", "bio": null, "roles": ["Foreword by"], "books": [{"title": "Beauty on Earth", "slug": "beauty-on-earth", "role": "Foreword by"}]}, "whitall-james": {"name": "Whitall, James", "bio": "James Whitall (b. 1888) was an American writer and translator, author of the memoir English Years (1935) and translator of Chinese Lyrics from the Book of Jade (1918) and Pierre Hamp's People. His 1922 translation of The Reign of the Evil One (Harcourt, Brace) was the first of Ramuz's books to appear in English; this edition carries an introduction by the critic Ernest Boyd.", "roles": ["Translator"], "books": [{"title": "The Reign of the Evil One", "slug": "the-reign-of-the-evil-one", "role": "Translator"}]}, "boyd-ernest": {"name": "Boyd, Ernest", "bio": null, "roles": ["Introduction by"], "books": [{"title": "The Reign of the Evil One", "slug": "the-reign-of-the-evil-one", "role": "Introduction by"}]}, "marxsen-patti-m": {"name": "Marxsen, Patti M", "bio": "Patti M. Marxsen is an American essayist, biographer and translator whose work has appeared in Asymptote, The French Review and the Women's Review of Books. Her critical biography Jacques Roumain: A Life of Resistance won the 2019 Haitian Studies Association Book Prize, and her essay 'Gateau de Payerne' took the inaugural Geneva Writers' Group Literary Award for Non-Fiction. A devotee of Ramuz during her years in Switzerland, she has translated both his prose-poem Riversong of the Rhone and the novel Passage of the Poet. This bilingual edition carries a foreword by Susan Tiberghien.", "roles": ["Translator"], "books": [{"title": "Riversong of the Rhône", "slug": "riversong-of-the-rho-ne", "role": "Translator"}]}, "tiberghien-susan": {"name": "Tiberghien, Susan", "bio": null, "roles": ["Foreword by"], "books": [{"title": "Riversong of the Rhône", "slug": "riversong-of-the-rho-ne", "role": "Foreword by"}]}, "spinney-laura": {"name": "Spinney, Laura", "bio": "Laura Spinney is a British science journalist and novelist based in Paris. She is the author of the international bestseller Pale Rider: The Spanish Flu of 1918 and How It Changed the World, translated into more than twenty languages, and of Proto: How One Ancient Language Went Global (2025), as well as two novels, The Doctor and The Quick. Her writing appears in National Geographic, Nature, The Economist and The Guardian.", "roles": ["Foreword by", "Translator"], "books": [{"title": "What if the sun...", "slug": "what-if-the-sun", "role": "Foreword by"}, {"title": "Derborence: Where the devils came down", "slug": "derborence-where-the-devils-came-down", "role": "Translator"}]}, "kraszewski-j-zef-ignacy": {"name": "Kraszewski, Józef Ignacy", "bio": "Jozef Ignacy Kraszewski (1812-1887) was among the most prolific writers in literary history, author of more than 200 novels alongside plays, poetry and historical studies. A Polish novelist, journalist and political activist, he travelled across pre-partition Poland and much of Europe, and is celebrated above all for his cycle of historical novels. Skomlin also publishes Kraszewski's Count Bruhl.", "roles": ["Author"], "books": [{"title": "Countess Cosel", "slug": "countess-cosel", "role": "Author"}, {"title": "Count Brühl", "slug": "count-br-hl", "role": "Author"}]}, "de-savoy-carignan-guy-jean-raoul-euge": {"name": "de Savoy-Carignan, Guy Jean Raoul Eugè", "bio": null, "roles": ["Translator"], "books": [{"title": "Countess Cosel", "slug": "countess-cosel", "role": "Translator"}, {"title": "Count Brühl", "slug": "count-br-hl", "role": "Translator"}]}, "boxall-george-e": {"name": "Boxall, George E", "bio": "George E. Boxall was an English-born writer and journalist whose History of the Australian Bushrangers (first published 1899) became a standard early account of colonial outlawry. This edition appends The Jerilderie Letter (1879), Ned Kelly's own manifesto, dictated by the outlaw to explain and justify his campaign against the colonial authorities. [VERIFY: biographical detail on Boxall is limited.]", "roles": ["Author"], "books": [{"title": "History of Australian Bushrangers: & The Jerilderie Letter", "slug": "history-of-australian-bushrangers-the-jerilderie-letter", "role": "Author"}]}, "kelly-ned": {"name": "Kelly, Ned", "bio": null, "roles": ["Author"], "books": [{"title": "History of Australian Bushrangers: & The Jerilderie Letter", "slug": "history-of-australian-bushrangers-the-jerilderie-letter", "role": "Author"}]}, "leskov-nikolai": {"name": "Leskov, Nikolai", "bio": "Nikolai Leskov (1831-1895) was a Russian novelist, short-story writer and journalist, admired by Chekhov and Gorky for his mastery of vernacular Russian and his vivid portraits of provincial and clerical life. Born in Gorokhovo, Oryol Province, he drew on wide travels across Russia; his tale Lady Macbeth of the Mtsensk District later inspired Shostakovich's opera. Skomlin also publishes Leskov's Cross-eyed Lefty and the Steel Flea.", "roles": ["Author"], "books": [{"title": "Lady Macbeth of the Mzinsk District", "slug": "lady-macbeth-of-the-mzinsk-district", "role": "Author"}, {"title": "Cross-eyed Lefty and the Steel Flea", "slug": "cross-eyed-lefty-and-the-steel-flea", "role": "Author"}]}, "chamot-alfred": {"name": "Chamot, Alfred", "bio": null, "roles": ["Translator"], "books": [{"title": "Lady Macbeth of the Mzinsk District", "slug": "lady-macbeth-of-the-mzinsk-district", "role": "Translator"}]}, "hapgood-isabel": {"name": "Hapgood, Isabel", "bio": null, "roles": ["Translator"], "books": [{"title": "Cross-eyed Lefty and the Steel Flea", "slug": "cross-eyed-lefty-and-the-steel-flea", "role": "Translator"}]}, "hesse-hermann": {"name": "Hesse, Hermann", "bio": "Hermann Hesse (1877-1962) was a German-born Swiss novelist, poet and painter, awarded the Nobel Prize in Literature in 1946. Born in Calw, Germany, and later a citizen of Switzerland, he wrote fiction preoccupied with the individual's search for authenticity and spiritual wholeness. His major works - Siddhartha (1922), Steppenwolf, Demian and The Glass Bead Game - drew on Indian and East Asian thought and made him one of the most widely read European authors of the twentieth century. Skomlin also publishes Hesse's The Journey to the East.", "roles": ["Author"], "books": [{"title": "Siddhartha: An Indian Tale", "slug": "siddhartha-an-indian-tale", "role": "Author"}, {"title": "The Journey to the East", "slug": "the-journey-to-the-east", "role": "Author"}]}, "rosner-hilda": {"name": "Rosner, Hilda", "bio": null, "roles": ["Translator"], "books": [{"title": "Siddhartha: An Indian Tale", "slug": "siddhartha-an-indian-tale", "role": "Translator"}, {"title": "The Journey to the East", "slug": "the-journey-to-the-east", "role": "Translator"}]}, "joyce-james": {"name": "Joyce, James", "bio": "James Joyce (1882-1941) was an Irish novelist and poet, one of the most influential writers of the twentieth century and author of Ulysses. Born in Dublin, he spent most w Nineties. [VERIFY: biographical detail on Ruding is scarce.]", "roles": ["Author"], "books": [{"title": "An Evil Motherhood: An Impressionist Novel", "slug": "an-evil-motherhood-an-impressionist-novel", "role": "Author"}]}, "beardsley-aubrey": {"name": "Beardsley, Aubrey", "bio": null, "roles": ["Illustrator"], "books": [{"title": "An Evil Motherhood: An Impressionist Novel", "slug": "an-evil-motherhood-an-impressionist-novel", "role": "Illustrator"}]}, "proust-marcel": {"name": "Proust, Marcel", "bio": "Marcel Proust (1871-1922) was a French novelist whose seven-volume In Search of Lost Time is among the supreme achievements of twentieth-century literature. Born in Auteuil, Paris, he devoted his later years almost entirely to the novel. 'Swann in Love', a self-contained section of Swann's Way, traces a consuming, jealous passion in fashionable Paris.", "roles": ["Author"], "books": [{"title": "Swann in Love", "slug": "swann-in-love", "role": "Author"}]}, "scott-moncrieff-charles-kenneth": {"name": "Scott Moncrieff, Charles Kenneth", "bio": null, "roles": ["Translator"], "books": [{"title": "Swann in Love", "slug": "swann-in-love", "role": "Translator"}]}, "turgenev-ivan": {"name": "Turgenev, Ivan", "bio": "Ivan Turgenev (1818-1883) was a Russian novelist, short-story writer and playwright, the first Russian author to win wide fame across Europe. Born in Oryol into a wealthy landowning family, he spent much of his life in France and Germany and counted Flaubert and the Goncourts among his friends. His major works include Fathers and Sons and A Sportsman's Sketches. Skomlin also publishes Turgenev's The Diary of a Superfluous Man.", "roles": ["Author"], "books": [{"title": "King Lear of the Steppes", "slug": "king-lear-of-the-steppes", "role": "Author"}, {"title": "The Diary of a Superfluous Man", "slug": "the-diary-of-a-superfluous-man", "role": "Author"}]}, "garnett-constance": {"name": "Garnett, Constance", "bio": null, "roles": ["Translator"], "books": [{"title": "King Lear of the Steppes", "slug": "king-lear-of-the-steppes", "role": "Translator"}, {"title": "The Diary of a Superfluous Man", "slug": "the-diary-of-a-superfluous-man", "role": "Translator"}]}, "baroja-p-o": {"name": "Baroja, Pío", "bio": "Pio Baroja (1872-1956) was a Basque-Spanish novelist, a central figure of Spain's 'Generation of '98' whom Hemingway openly admired. Born in San Sebastian, he wrote spare, restless fiction of Spanish life across dozens of novels. The City of the Discreet is set among the schemers and dreamers of Cordoba.", "roles": ["Author"], "books": [{"title": "The City of the Discreet", "slug": "the-city-of-the-discreet", "role": "Author"}]}, "fassett-jacob": {"name": "Fassett, Jacob", "bio": null, "roles": ["Translator"], "books": [{"title": "The City of the Discreet", "slug": "the-city-of-the-discreet", "role": "Translator"}]}, "olivier-jean-michel": {"name": "Olivier, Jean-Michel", "bio": "Jean-Michel Olivier (born 1952 in Nyon, Vaud) is a Swiss novelist, journalist and teacher who studied literature at the University of Geneva under Jean Starobinski and Michel Butor. The author of some twenty novels alongside essays and poetry, he won the Prix Interallie in 2010 for L'Amour negre - a rare Swiss recipient of a major French literary prize. Since 2006 he has directed the Poche Suisse collection at Editions L'Age d'Homme.", "roles": ["Author"], "books": [{"title": "The Secret Child", "slug": "the-secret-child", "role": "Author"}]}, "moscato-laurence": {"name": "Moscato, Laurence", "bio": "Laurence Moscato is a professor of translation studies in California and a literary translator working from French into English. Her English translation of Jean-Michel Olivier's Prix Dentan-winning L'Enfant secret, published as The Secret Child (Skomlin, 2018) with a preface by the scholar Clorinda Donato, was praised for its deft rendering of the author's lyrical prose.", "roles": ["Translator"], "books": [{"title": "The Secret Child", "slug": "the-secret-child", "role": "Translator"}]}, "donato-clorinda": {"name": "Donato, Clorinda", "bio": null, "roles": ["Editor"], "books": [{"title": "The Secret Child", "slug": "the-secret-child", "role": "Editor"}]}, "weeks-john": {"name": "Weeks, John", "bio": "John Weeks studied French, Russian and Polish at Amherst College and holds a doctorate in Slavic languages and literatures from the University of California, Berkeley, where he later taught Polish following a Fulbright fellowship in Poland. He has translated widely from Russian and Polish; Farinet's Gold is his first published literary translation.", "roles": ["Translator"], "books": [{"title": "Farinet's Gold", "slug": "farinet-s-gold", "role": "Translator"}]}, "mann-thomas": {"name": "Mann, Thomas", "bio": "Thomas Mann (1875-1955) was a German novelist and Nobel laureate (1929), author of Buddenbrooks, The Magic Mountain and Death in Venice. Born in Lubeck, he went into exile after 1933 in opposition to Nazism. Royal Highness (1909), his second novel, is a gently ironic romance set in a minor German principality.", "roles": ["Author"], "books": [{"title": "Royal Highness", "slug": "royal-highness", "role": "Author"}]}, "dos-passos-john": {"name": "Dos Passos, John", "bio": "John Dos Passos (1896-1970) was an American novelist and one of the foremost chroniclers of the modern age, best known for his U.S.A. trilogy. Born in Chicago, he served as a volunteer ambulance driver in the First World War and travelled widely in Europe. Skomlin also publishes Dos Passos's One Man's Initiation: 1917.", "roles": ["Author"], "books": [{"title": "Rosinante to the Road Again", "slug": "rosinante-to-the-road-again", "role": "Author"}, {"title": "One Man's Initiation: 1917", "slug": "one-man-s-initiation-1917", "role": "Author"}]}, "reymont-wladyslaw-stanislaw": {"name": "Reymont, Wladyslaw Stanislaw", "bio": "Wladyslaw Reymont (1867-1925) was a Polish novelist and Nobel laureate (1924), best known for his four-volume epic The Peas <script>
const BOOKS = JSON.parse(document.getElementById('book-data').textContent);
const CONTRIBUTORS = JSON.parse(document.getElementById('contributor-data').textContent);

const SEAL_SVG = `<svg class="seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <circle cx="50" cy="50" r="47" fill="none" stroke="#8B1A1A" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#8B1A1A" stroke-width="1"/>
  <g fill="#8B1A1A">
    ${Array.from({length:28}).map((_,i)=>{
      const a = (i/28)*2*Math.PI;
      const x = 50 + 44*Math.cos(a), y = 50 + 44*Math.sin(a);
      return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="0.9"/>`;
    }).join('')}
  </g>
  <path d="M50 26c-9 0-16 8-16 20 0 15 10 24 16 28 6-4 16-13 16-28 0-12-7-20-16-20z" fill="none" stroke="#8B1A1A" stroke-width="1.6"/>
  <path d="M35 40c-6-2-11 0-13 3M65 40c6-2 11 0 13 3M50 30v16M42 50c-3 4-9 5-13 3M58 50c3 4 9 5 13 3" stroke="#8B1A1A" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="41" r="2.1" fill="#8B1A1A"/>
</svg>`;

const SEAL_LG = SEAL_SVG.replace('class="seal"', 'class="seal seal-lg"');

/* ---------- helpers ---------- */
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}

function primaryContributors(book){
  // authors first (or first contributor if none marked Author), for byline
  const authors = book.contributors.filter(c => (c.role||'').toLowerCase() === 'author');
  return authors.length ? authors : [book.contributors[0]];
}

function bylineHTML(book){
  return book.contributors.map(c => {
    const label = c.role ? `${c.name} <span style="opacity:.6">(${c.role})</span>` : c.name;
    return `<a href="#/contributor/${c.slug}">${label}</a>`;
  }).join(' &middot; ');
}

let _coverCache = null;
function getCoverData(){
  if(!_coverCache){
    const el = document.getElementById('cover-data');
    if(el) _coverCache = JSON.parse(el.textContent);
  }
  return _coverCache || {};
}
function coverHTML(book, idx){
  const authors = primaryContributors(book).map(c=>c.name.split(',').reverse().join(' ').trim()).join(', ');
  const coverData = getCoverData();
  if(coverData[book.slug]){
    return `<div class="cover-real"><img src="${coverData[book.slug]}" alt="${book.title}" loading="lazy"></div>`;
  }
  const paletteClass = ['cv-0','cv-1','cv-2'][idx % 5 === 0 ? 2 : (idx % 2)];
  return `
    <div class="cover ${paletteClass}">
      ${book.series ? `<div class="cover-series">${book.series}</div>` : ''}
      <div class="cover-title">${book.title}</div>
      <div class="cover-rule"></div>
      <div class="cover-author">${authors}</div>
      <div class="cover-imprint">Skomlin</div>
    </div>`;
}

function bookCardHTML(book, idx){
  const authors = primaryContributors(book).map(c=>c.name.split(',').reverse().join(' ').trim()).join(', ');
  return `
    <div class="book-card" onclick="location.hash='#/book/${book.slug}'">
      ${coverHTML(book, idx)}
      <div class="meta">
        <div class="t">${book.title}</div>
        <div class="a">${authors}</div>
      </div>
    </div>`;
}

function facts(book){
  const items = [];
  if(book.format) items.push(`<span><b>Format</b> ${book.format}</span>`);
  if(book.page_count) items.push(`<span><b>Pages</b> ${book.page_count}</span>`);
  if(book.us_list||book.uk_list||book.aus_list||book.eur_list){
    const row=[];
    if(book.us_list)  row.push(`<b>USD</b>&nbsp;$${parseFloat(book.us_list).toFixed(2)}`);
    if(book.uk_list)  row.push(`<b>GBP</b>&nbsp;£${parseFloat(book.uk_list).toFixed(2)}`);
    if(book.eur_list) row.push(`<b>EUR</b>&nbsp;€${parseFloat(book.eur_list).toFixed(2)}`);
    if(book.aus_list) row.push(`<b>AUD</b>&nbsp;A$${parseFloat(book.aus_list).toFixed(2)}`);
    items.push(`<span class="price-row">${row.join('&ensp;·&ensp;')}</span>`);
  }
  if(book.bisac) items.push(`<span><b>Category</b> ${book.bisac}</span>`);
  return items.join('');
}

/* ---------- page renderers ---------- */
function renderHome(){
  const featured = BOOKS.slice(0, 6);
  return `
    <section class="hero">
      ${SEAL_LG}
      <div class="eyebrow">World Literature in Translation</div>
      <h1>Books built to be read again.</h1>
      <p class="lede">Skomlin Press publishes classic and contemporary literature from Poland, Switzerland, Russia, France and beyond &mdash; brought into English by translators who treat the work as their own.</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="#/catalogue">Browse the Catalogue</a>
        <a class="btn btn-outline" href="#/trade">For Booksellers</a>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <div class="block-head">
          <div class="eyebrow">Recently Added</div>
          <h2>From the Shelf</h2>
        </div>
        <div class="shelf">${featured.map((b,i)=>bookCardHTML(b,i)).join('')}</div>
        <div style="text-align:center; margin-top:40px;">
          <a class="btn btn-outline" href="#/catalogue">View Full Catalogue (${BOOKS.length} Titles)</a>
        </div>
      </div>
    </section>

    <section class="trade-band">
      <div class="wrap">
        <div>
          <div class="eyebrow" style="color:var(--cream); opacity:.85;">For Independent Booksellers</div>
          <h2>Stock the Catalogue</h2>
          <p>We work with independent bookshops directly &mdash; sale-or-return terms, personal introductions to each title, and a catalogue built for hand-selling. Join the trade mailing list to hear about new titles and stockist terms first.</p>
          <div style="margin-top:22px;"><a class="btn" style="border-color:var(--cream); color:var(--cream);" href="#/trade">Learn More &amp; Sign Up</a></div>
        </div>
        <div class="form-card" id="homeSignupCard">${signupFormHTML('home')}</div>
      </div>
    </section>
  `;
}

function renderCatalogue(){
  return `
    <section class="block" style="padding-top:36px;">
      <div class="wrap">
        <div class="block-head" style="margin-bottom:0;">
          <div class="eyebrow">The Full List</div>
          <h2>Catalogue</h2>
        </div>
        <div class="cat-controls">
          <div class="field search">
            <label for="catSearch">Search</label>
            <input type="text" id="catSearch" placeholder="Title, author, translator, or theme&hellip;">
          </div>
          <div class="field">
            <label for="catRole">Contributor Role</label>
            <select id="catRole"><option value="">All roles</option></select>
          </div>
          <div class="field">
            <label for="catSeries">Series</label>
            <select id="catSeries"><option value="">All series</option></select>
          </div>
        </div>
        <div class="cat-count" id="catCount"></div>
        <div class="shelf" id="catGrid"></div>
      </div>
    </section>
  `;
}

function wireCatalogue(){
  const roleSel = document.getElementById('catRole');
  const seriesSel = document.getElementById('catSeries');
  const searchInput = document.getElementById('catSearch');
  const grid = document.getElementById('catGrid');
  const count = document.getElementById('catCount');

  const roles = new Set();
  const series = new Set();
  BOOKS.forEach(b=>{
    b.contributors.forEach(c=>{ if(c.role) roles.add(c.role); });
    if(b.series) series.add(b.series);
  });
  [...roles].sort().forEach(r=>{
    const o = document.createElement('option'); o.value=r; o.textContent=r; roleSel.appendChild(o);
  });
  [...series].sort().forEach(s=>{
    const o = document.createElement('option'); o.value=s; o.textContent=s; seriesSel.appendChild(o);
  });

  function matches(b, q, role, ser){
    if(role && !b.contributors.some(c=>c.role===role)) return false;
    if(ser && b.series !== ser) return false;
    if(q){
      const hay = [
        b.title, b.keywords, b.short_description,
        ...b.contributors.map(c=>c.name)
      ].join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }

  function draw(){
    const q = searchInput.value.trim();
    const role = roleSel.value;
    const ser = seriesSel.value;
    const filtered = BOOKS.filter(b=>matches(b,q,role,ser));
    count.textContent = `${filtered.length} of ${BOOKS.length} titles`;
    if(!filtered.length){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="es-title">No titles match</div>
        <div>Try clearing a filter or searching a different term.</div>
      </div>`;
      return;
    }
    grid.innerHTML = filtered.map((b,i)=>bookCardHTML(b,i)).join('');
  }

  searchInput.addEventListener('input', draw);
  roleSel.addEventListener('change', draw);
  seriesSel.addEventListener('change', draw);
  draw();
}

function renderBookDetail(slug){
  const book = BOOKS.find(b=>b.slug===slug);
  if(!book){ location.hash = '#/catalogue'; return ''; }
  const idx = BOOKS.indexOf(book);
  return `
    <div class="detail">
      <div class="wrap">
        <a class="back-link" href="#/catalogue">&larr; Back to Catalogue</a>
        <div class="detail-grid">
          <div class="detail-cover">${coverHTML(book, idx)}</div>
          <div>
            <div class="detail-imprint">${book.imprint} Press ${book.series ? '&middot; '+book.series : ''}</div>
            <h1>${book.title}</h1>
            <div class="by-line">${bylineHTML(book)}</div>
            <div class="facts">${facts(book)}</div>
            <div class="full-desc">${book.full_description || `<p>${book.short_description||''}</p>`}</div>
            ${book.review_quotes ? `<div class="review-quote">${book.review_quotes}</div>` : ''}
            <div class="contrib-block">
              <h3>Contributors</h3>
              ${book.contributors.map(c=>`
                <div class="contrib-card">
                  <div><span class="cn"><a href="#/contributor/${c.slug}">${c.name}</a></span>${c.role?`<span class="cr">${c.role}</span>`:''}</div>
                  ${c.bio ? `<div class="cb">${c.bio}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderContributorsList(){
  const names = Object.keys(CONTRIBUTORS).sort((a,b)=>{
    const na = CONTRIBUTORS[a].name.toLowerCase(), nb = CONTRIBUTORS[b].name.toLowerCase();
    return na < nb ? -1 : na > nb ? 1 : 0;
  });
  return `
    <section class="block" style="padding-top:36px;">
      <div class="wrap">
        <div class="block-head">
          <div class="eyebrow">Authors, Translators &amp; Introducers</div>
          <h2>Contributors</h2>
        </div>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px;">
          ${names.map(k=>{
            const c = CONTRIBUTORS[k];
            return `<a href="#/contributor/${k}" style="display:block; padding:18px; background:var(--white); border:1px solid var(--rule);">
              <div style="font-weight:600; font-size:1.05rem; color:var(--slate);">${c.name}</div>
              <div class="small-caps" style="color:var(--crimson); font-size:0.8rem; margin-top:4px;">${c.roles.join(' / ')}</div>
              <div style="font-size:0.85rem; color:var(--slate-light); margin-top:6px;">${c.books.length} title${c.books.length>1?'s':''}</div>
            </a>`;
          }).join('')}
        </div>
      </div>
    </section>
  `;
}

function renderContributorDetail(slug){
  const c = CONTRIBUTORS[slug];
  if(!c){ location.hash = '#/contributors'; return ''; }
  return `
    <div class="contrib-header">
      <div class="eyebrow">${c.roles.join(' / ')}</div>
      <h1>${c.name}</h1>
      <div class="contrib-bio">${c.bio ? `<p>${c.bio}</p>` : '<p style="color:var(--slate-light); font-style:italic;">Biography on file &mdash; to be added.</p>'}</div>
    </div>
    <section class="block">
      <div class="wrap">
        <div class="block-head"><h2>Titles</h2></div>
        <div class="shelf">
          ${c.books.map(bk=>{
            const book = BOOKS.find(b=>b.slug===bk.slug);
            const idx = BOOKS.indexOf(book);
            return bookCardHTML(book, idx);
          }).join('')}
        </div>
      </div>
    </section>
  `;
}

function signupFormHTML(ctx){
  return `
    <form class="signup-form" data-ctx="${ctx}" onsubmit="return handleSignup(event)">
      <div class="field">
        <label for="sf-store-${ctx}">Bookshop Name</label>
        <input type="text" id="sf-store-${ctx}" required placeholder="e.g. Shakespeare and Company">
      </div>
      <div class="field">
        <label for="sf-name-${ctx}">Contact Name</label>
        <input type="text" id="sf-name-${ctx}" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="sf-email-${ctx}">Email</label>
        <input type="email" id="sf-email-${ctx}" required placeholder="you@bookshop.com">
      </div>
      <div class="field">
        <label for="sf-city-${ctx}">City / Country</label>
        <input type="text" id="sf-city-${ctx}" placeholder="e.g. Paris, France">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; border:none;">Join the Trade List</button>
      <div class="form-note">We'll only use this to share new titles, stockist terms, and sell-sheets. No spam, unsubscribe any time.</div>
    </form>
    <div class="confirm" id="confirm-${ctx}">
      <div class="tick">&#10003;</div>
      <div class="small-caps" style="color:var(--crimson);">You're on the list</div>
      <div style="color:var(--slate-light); font-size:0.92rem; margin-top:6px;">We'll be in touch with new titles and stockist terms.</div>
    </div>
  `;
}

function handleSignup(e){
  e.preventDefault();
  const ctx = e.target.getAttribute('data-ctx');
  e.target.classList.add('hidden');
  const conf = document.getElementById('confirm-'+ctx);
  if(conf) conf.classList.add('show');
  return false;
}

function renderTrade(){
  return `
    <section class="hero" style="padding-bottom:20px;">
      <div class="eyebrow">For Independent Booksellers</div>
      <h1>Stock Skomlin in Your Shop</h1>
      <p class="lede">We're a small press working directly with independent bookshops &mdash; no distributor markup, sale-or-return terms for a trial stock, and a catalogue built for hand-selling: translated literary fiction with real stories behind each edition.</p>
    </section>
    <section class="block">
      <div class="wrap" style="display:grid; grid-template-columns:1.1fr 1fr; gap:50px; align-items:flex-start;">
        <div>
          <h2 style="font-style:italic; color:var(--crimson); font-size:1.5rem;">How it works</h2>
          <div style="margin-top:18px; display:flex; flex-direction:column; gap:22px;">
            <div>
              <div class="small-caps" style="color:var(--crimson);">Sale or Return</div>
              <div style="color:var(--slate-light); margin-top:4px;">Trial a small stock of titles with no upfront risk &mdash; return what doesn't sell.</div>
            </div>
            <div>
              <div class="small-caps" style="color:var(--crimson);">Sell Sheets</div>
              <div style="color:var(--slate-light); margin-top:4px;">Each title comes with a one-page sheet: hook, comparable titles, and hand-selling notes.</div>
            </div>
            <div>
              <div class="small-caps" style="color:var(--crimson);">Direct Relationship</div>
              <div style="color:var(--slate-light); margin-top:4px;">You deal with the publisher directly &mdash; not a distributor's order desk.</div>
            </div>
          </div>
        </div>
        <div class="form-card">${signupFormHTML('trade')}</div>
      </div>
    </section>
  `;
}

function renderAbout(){
  return `
    <section class="hero" style="padding-bottom:10px;">
      <div class="eyebrow">Since the Founding</div>
      <h1>About Skomlin Press</h1>
    </section>
    <section class="block">
      <div class="about-copy">
        <p>Skomlin Press publishes classic and contemporary literature in translation &mdash; novels and novellas from Poland, Switzerland, Russia, France and beyond, brought into English by translators who treat the work as their own rather than a service rendered.</p>
        <p>The list favours books that reward rereading over books built for a single sitting: forgotten classics restored to print, and newer work chosen with the same standard.</p>
        <h2>What We Value</h2>
        <div class="values-row">
          <div class="value-chip"><div class="vt">Permanence</div></div>
          <div class="value-chip"><div class="vt">Rigour</div></div>
          <div class="value-chip"><div class="vt">Craft</div></div>
          <div class="value-chip"><div class="vt">Restraint</div></div>
          <div class="value-chip"><div class="vt">Heritage</div></div>
        </div>
        <h2>The Catalogue</h2>
        <p>${BOOKS.length} titles are currently in print, spanning literary fiction, novellas and one long-running collaboration with the six translators of Charles-Ferdinand Ramuz. Browse the <a href="#/catalogue" style="color:var(--crimson);">full catalogue</a> or meet the <a href="#/contributors" style="color:var(--crimson);">translators and authors</a> behind it.</p>
      </div>
    </section>
  `;
}

/* ---------- router ---------- */
const app = document.getElementById('app');

function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  document.querySelectorAll('nav.main-nav a').forEach(a=>a.classList.remove('active'));

  let html = '';
  if(parts.length === 0){
    html = renderHome();
  } else if(parts[0] === 'catalogue'){
    html = renderCatalogue();
    document.querySelector('[data-nav="catalogue"]')?.classList.add('active');
  } else if(parts[0] === 'book' && parts[1]){
    html = renderBookDetail(parts[1]);
  } else if(parts[0] === 'contributors' && !parts[1]){
    html = renderContributorsList();
    document.querySelector('[data-nav="contributors"]')?.classList.add('active');
  } else if(parts[0] === 'contributor' && parts[1]){
    html = renderContributorDetail(parts[1]);
  } else if(parts[0] === 'trade'){
    html = renderTrade();
    document.querySelector('[data-nav="trade"]')?.classList.add('active');
  } else if(parts[0] === 'about'){
    html = renderAbout();
    document.querySelector('[data-nav="about"]')?.classList.add('active');
  } else {
    html = renderHome();
  }

  app.innerHTML = html;
  window.scrollTo(0,0);
  if(parts[0] === 'catalogue') wireCatalogue();
  document.getElementById('mainNav')?.classList.remove('open');
}

window.addEventListener('hashchange', route);
document.getElementById('navToggle').addEventListener('click', ()=>{
  document.getElementById('mainNav').classList.toggle('open');
});
document.querySelector('.brand').addEventListener('click', ()=>{ location.hash = '#/'; });

// Run after full DOM parse so cover-data element is available
document.addEventListener('DOMContentLoaded', route);
</script>
