<html lang="en">
<head>

<style>
:root{
  --crimson:#8B1A1A;
  --crimson-dark:#6B1414;
  --crimson-tint:#F2E3E0;
  --slate:#4A5568;
  --slate-light:#7C879A;
  --cream:#F5F0E8;
  --cream-deep:#ECE4D6;
  --white:#FFFFFF;
  --rule:#D9CFBE;
  --shadow: 0 1px 2px rgba(74,85,104,0.08), 0 8px 24px rgba(74,85,104,0.06);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  overflow-x:hidden;
  font-family:'EB Garamond', Garamond, Georgia, serif;
  background:var(--cream);
  color:var(--slate);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button{font-family:inherit;}
.small-caps{
  font-variant:small-caps;
  letter-spacing:0.09em;
  font-weight:600;
}
.eyebrow{
  font-variant:small-caps;
  letter-spacing:0.16em;
  font-size:0.82rem;
  color:var(--crimson);
  font-weight:600;
}
.beaded-rule{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 auto;
  width:100%;
  max-width:120px;
}
.beaded-rule span{
  width:4px;height:4px;border-radius:50%;
  background:var(--crimson);
  opacity:0.55;
}
.beaded-rule span:nth-child(1),.beaded-rule span:nth-child(7){opacity:0.25;}
.beaded-rule.left{justify-content:flex-start; max-width:none;}

/* ===== Header ===== */
header.site-header{
  position:sticky; top:0; z-index:40;
  background:rgba(245,240,232,0.94);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--rule);
}
.header-inner{
  max-width:1180px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
}
.brand{
  display:flex; align-items:center; gap:12px;
  cursor:pointer;
}
.seal{width:44px; height:44px; flex-shrink:0;}
.brand-word{
  font-variant:small-caps;
  letter-spacing:0.12em;
  font-weight:700;
  font-size:1.28rem;
  color:var(--crimson);
}
.brand-sub{
  display:block;
  font-size:0.62rem;
  letter-spacing:0.22em;
  color:var(--slate-light);
  font-variant:small-caps;
  margin-top:1px;
}
nav.main-nav{display:flex; gap:28px; align-items:center;}
nav.main-nav a{
  font-variant:small-caps; letter-spacing:0.08em; font-weight:600;
  font-size:1rem; color:var(--slate); padding:6px 2px;
  border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s;
}
nav.main-nav a:hover, nav.main-nav a.active{color:var(--crimson); border-color:var(--crimson);}
.nav-toggle{
  display:none; background:none; border:none; cursor:pointer;
  color:var(--crimson); font-size:1.6rem; line-height:1; padding:4px 8px;
}
@media (max-width:820px){
  nav.main-nav{
    position:fixed; top:73px; left:0; right:0; bottom:0;
    background:var(--cream); flex-direction:column; align-items:flex-start;
    padding:28px 28px; gap:22px; transform:translateX(100%);
    transition:transform .25s ease; overflow-y:auto;
  }
  nav.main-nav.open{transform:translateX(0);}
  nav.main-nav a{font-size:1.3rem;}
  .nav-toggle{display:block;}
}

main{min-height:70vh;}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px;}

/* ===== Hero ===== */
.hero{
  padding:76px 20px 60px;
  text-align:center;
  border-bottom:1px solid var(--rule);
}
.hero .seal-lg{width:96px; height:96px; margin:0 auto 26px;}
.hero h1{
  font-weight:500; font-style:italic;
  font-size:clamp(2.1rem, 5vw, 3.4rem);
  color:var(--crimson);
  margin:0 0 18px;
  line-height:1.15;
}
.hero p.lede{
  max-width:560px; margin:0 auto 30px;
  color:var(--slate); font-size:1.15rem; line-height:1.65;
}
.btn-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
.btn{
  display:inline-block; padding:13px 30px;
  font-variant:small-caps; letter-spacing:0.08em; font-weight:700; font-size:1.02rem;
  border-radius:2px; cursor:pointer; border:1px solid var(--crimson);
  transition:background .15s,color .15s;
}
.btn-primary{background:var(--crimson); color:var(--white);}
.btn-primary:hover{background:var(--crimson-dark);}
.btn-outline{background:transparent; color:var(--crimson);}
.btn-outline:hover{background:var(--crimson); color:var(--white);}

/* ===== Section shells ===== */
section.block{padding:56px 20px;}
.block-head{text-align:center; margin-bottom:38px;}
.block-head h2{
  font-style:italic; font-weight:500; color:var(--crimson);
  font-size:1.9rem; margin:10px 0 0;
}

/* ===== Shelf / grid ===== */
.shelf{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:30px 22px;
}
.book-card{cursor:pointer;}
.cover{
  aspect-ratio:2/3; border-radius:1px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:18px 14px; position:relative;
  border:1px solid var(--rule);
  transition:transform .18s ease, box-shadow .18s ease;
}
.book-card:hover .cover{transform:translateY(-4px); box-shadow:0 4px 8px rgba(74,85,104,0.12), 0 16px 30px rgba(74,85,104,0.14);}
.cover .cover-rule{width:34px; height:1px; background:var(--crimson); margin:10px auto;}
.cover .cover-series{
  position:absolute; top:12px; left:12px; right:12px;
  font-size:0.6rem; letter-spacing:0.14em; font-variant:small-caps;
  color:var(--crimson); opacity:0.8; text-align:left;
}
.cover .cover-title{
  font-style:italic; font-weight:600; font-size:1.05rem; color:var(--slate);
  line-height:1.25;
}
.cover .cover-author{
  font-variant:small-caps; letter-spacing:0.06em; font-size:0.78rem; color:var(--slate-light);
  margin-top:8px;
}
.cover .cover-imprint{
  position:absolute; bottom:12px; left:0; right:0;
  font-size:0.58rem; letter-spacing:0.2em; color:var(--slate-light); opacity:0.7;
}
.book-card .meta{padding:10px 2px 0; text-align:center;}
.book-card .meta .t{font-weight:600; font-size:0.98rem; color:var(--slate); font-style:italic;}
.book-card .meta .a{font-size:0.85rem; color:var(--slate-light); font-variant:small-caps; letter-spacing:0.04em;}

/* palette variants for covers, cycling through the approved palette only */
.cv-0{background:var(--white);}
.cv-1{background:var(--cream-deep);}
.cv-2{background:var(--crimson); }
.cv-2 .cover-title, .cv-2 .cover-author, .cv-2 .cover-series, .cv-2 .cover-imprint{color:var(--white); opacity:1;}
.cv-2 .cover-rule{background:var(--white);}


.cover-real { 
  width:100%; aspect-ratio:2/3; overflow:hidden; position:relative;
  background:var(--cream-deep);
}
.cover-real img { 
  width:100%; height:100%; object-fit:cover; display:block;
}
/* ===== Trade band ===== */
.trade-band{
  background:var(--crimson); color:var(--white); padding:56px 20px;
}
.trade-band .wrap{display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:center;}
@media (max-width:800px){.trade-band .wrap{grid-template-columns:1fr;}}
.trade-band h2{font-style:italic; font-weight:500; font-size:1.9rem; margin:0 0 14px;}
.trade-band p{opacity:0.92; line-height:1.65;}
.trade-band .beaded-rule span{background:var(--cream); opacity:0.6;}

/* ===== Forms ===== */
.form-card{
  background:var(--white); padding:30px; border-radius:2px; color:var(--slate);
  box-shadow:var(--shadow);
}
.field{margin-bottom:16px;}
.field label{
  display:block; font-variant:small-caps; letter-spacing:0.06em; font-weight:600;
  font-size:0.88rem; margin-bottom:6px; color:var(--slate);
}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border:1px solid var(--rule); border-radius:2px;
  font-family:'EB Garamond', Garamond, serif; font-size:1rem; background:var(--cream);
  color:var(--slate);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:2px solid var(--crimson); outline-offset:1px; background:var(--white);
}
.form-note{font-size:0.82rem; color:var(--slate-light); margin-top:14px; line-height:1.5;}
.confirm{
  display:none; text-align:center; padding:20px 10px;
}
.confirm.show{display:block;}
.confirm .tick{font-size:2rem; color:var(--crimson); margin-bottom:8px;}

/* ===== Catalogue page ===== */
.cat-controls{
  display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;
  padding:26px 0 30px; border-bottom:1px solid var(--rule); margin-bottom:34px;
}
.cat-controls .field{margin-bottom:0; flex:1; min-width:170px;}
.cat-controls .field.search{flex:2; min-width:220px;}
.cat-count{font-size:0.9rem; color:var(--slate-light); font-variant:small-caps; letter-spacing:0.05em; margin-top:-14px; margin-bottom:26px;}
.empty-state{text-align:center; padding:60px 20px; color:var(--slate-light);}
.empty-state .es-title{font-style:italic; font-size:1.3rem; color:var(--crimson); margin-bottom:8px;}

/* ===== Book detail ===== */
.detail{padding:50px 20px 70px;}
.detail-grid{display:grid; grid-template-columns:280px 1fr; gap:50px;}
@media (max-width:760px){.detail-grid{grid-template-columns:1fr; gap:32px;}}
.detail-cover{width:100%;}
.detail-cover .cover{aspect-ratio:2/3; width:100%; padding:28px 20px;}
.back-link{
  display:inline-block; margin-bottom:26px; font-variant:small-caps; letter-spacing:0.06em;
  color:var(--crimson); font-weight:600; font-size:0.95rem;
}
.back-link:hover{text-decoration:underline;}
.detail-imprint{font-size:0.72rem; letter-spacing:0.18em; color:var(--slate-light); font-variant:small-caps; margin-bottom:6px;}
.detail h1{
  font-style:italic; font-weight:600; color:var(--crimson);
  font-size:clamp(1.7rem,3.4vw,2.5rem); margin:0 0 10px; line-height:1.2;
}
.detail .by-line{font-size:1.05rem; color:var(--slate); margin-bottom:22px;}
.detail .by-line a{color:var(--crimson); border-bottom:1px solid transparent;}
.detail .by-line a:hover{border-color:var(--crimson);}
.detail .facts{
  display:flex; flex-wrap:wrap; gap:18px; margin:22px 0 26px;
  padding:16px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  font-size:0.88rem; color:var(--slate-light);
}
.detail .facts b{color:var(--slate); font-weight:600;}
.detail .full-desc{font-size:1.06rem; line-height:1.75;}
.detail .full-desc p{margin:0 0 1.1em;}
.review-quote{
  margin:30px 0; padding:22px 26px; border-left:3px solid var(--crimson);
  background:var(--cream-deep); font-style:italic; color:var(--slate); font-size:1.05rem;
}
.contrib-block{margin-top:38px; padding-top:28px; border-top:1px solid var(--rule);}
.contrib-block h3{font-variant:small-caps; letter-spacing:0.08em; color:var(--crimson); font-size:1.05rem; margin-bottom:16px;}
.contrib-card{margin-bottom:22px;}
.contrib-card .cn{font-weight:600; font-size:1.05rem;}
.contrib-card .cn a{color:var(--slate);}
.contrib-card .cn a:hover{color:var(--crimson);}
.contrib-card .cr{font-variant:small-caps; letter-spacing:0.05em; font-size:0.82rem; color:var(--crimson); margin-left:8px;}
.contrib-card .cb{font-size:0.95rem; color:var(--slate-light); margin-top:5px; line-height:1.55;}

/* ===== Contributor page ===== */
.contrib-header{padding:50px 20px 20px; text-align:center;}
.contrib-header h1{font-style:italic; color:var(--crimson); font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 10px;}
.contrib-header .roles{font-variant:small-caps; letter-spacing:0.08em; color:var(--slate-light); font-size:0.95rem;}
.contrib-bio{max-width:640px; margin:22px auto 0; font-size:1.06rem; line-height:1.75; text-align:left;}

/* ===== About page ===== */
.about-copy{max-width:680px; margin:0 auto; font-size:1.08rem; line-height:1.8;}
.about-copy h2{font-style:italic; color:var(--crimson); font-size:1.5rem; margin:38px 0 14px;}
.about-copy p{margin:0 0 1.2em;}
.values-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:20px; margin:34px 0;}
.value-chip{text-align:center; padding:18px 10px; border:1px solid var(--rule); background:var(--white);}
.value-chip .vt{font-variant:small-caps; letter-spacing:0.06em; font-weight:700; color:var(--crimson);}

/* ===== Footer / colophon ===== */
footer.colophon{
  border-top:1px solid var(--rule); padding:44px 20px 34px; margin-top:20px;
}
.colophon .wrap{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;}
.colophon .seal{width:38px; height:38px; opacity:0.85;}
.colophon .cw{font-variant:small-caps; letter-spacing:0.14em; font-weight:700; color:var(--crimson); font-size:1rem;}
.colophon .cl{font-size:0.8rem; color:var(--slate-light); max-width:440px; line-height:1.6;}
.colophon .clinks{display:flex; gap:18px; font-variant:small-caps; letter-spacing:0.06em; font-size:0.85rem;}
.colophon .clinks a:hover{color:var(--crimson);}

.hidden{display:none !important;}
@media (max-width:600px){
  .hero{padding:56px 18px 44px;}
  section.block{padding:42px 18px;}
  .detail{padding:36px 16px 50px;}
  .cat-controls{flex-direction:column; gap:10px;}
  .cat-controls .field, .cat-controls .field.search{min-width:0; width:100%; flex:none;}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:20px 14px;}
}

/* ===== Mobile overflow fix ===== */
@media (max-width: 768px){
  .header-inner,.wrap,.hero,.block,.page-inner,.trade-content,.search-bar{
    max-width:100vw;
    box-sizing:border-box;
    overflow-x:hidden;
  }
  .catalogue-grid,.feat-grid{
    grid-template-columns:1fr;
  }
  .book-card,.feat-card{
    min-width:0;
    width:100%;
  }
  .facts-row{
    flex-wrap:wrap;
    gap:4px;
  }
  .price-row{
    font-size:0.82rem;
    white-space:normal;
    line-height:1.5;
  }
  .hero h1{font-size:1.8rem;}
  .btn-row{flex-direction:column; align-items:stretch;}
  .btn-row .btn{text-align:center;}
}


.price-row{
  display:inline-flex;
  flex-wrap:wrap;
  gap:4px 12px;
  font-size:0.88rem;
  color:var(--slate);
}
.price-row b{color:var(--crimson);}

</style>
</head>

<script id="book-data" type="application/json">[{"isbn":"9780987153272","title":"The Journal of Countess Francoise Krasinska","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"126","bisac":"BIOGRAPHY & AUTOBIOGRAPHY / Royalty","full_description":"<p>The journal of the Francoise Krasinksa begins with her as a young girl living comfortably with her parents in the court of Maleszow in southern Poland. She is happy and innocent and  nurses a crush on Prince Charles pretender to the Polish throne. Francoise was related to nearly all the noblest families in Poland. Eminently beautiful intelligent and witty her escapades and her fate set tongues wagging in every court in Europe.</p>","short_description":"The journal of the Francoise Krasinksa begins with her as a young girl living comfortably with her parents in the court of Maleszow in southern Poland. She is happy and innocent and nurses a crush on Prince Charles pretender to the Polish throne. Beautiful and intelligent her escapades and her fate set tongues wagging in every court in Europe.","keywords":"18th-century Polish noblewoman's diary; a historical diary novel; forbidden royal romance; a woman's coming of age in old Poland; Polish court intrigue; classic Polish literature in translation","review_quotes":null,"us_list":"14.95","contributors":[{"name":"Tanska Hoffman, Klementyna","role":"Author","bio":"Klementyna Tanska Hoffmanowa (1798-1845) was a Polish writer and educator, among the first women in Poland to earn her living by the pen. Born in Warsaw, she wrote widely for young readers and on the moral education of women; The Journal of Countess Francoise Krasinska (1825), an imagined diary of an eighteenth-century Polish noblewoman, is her best-known work and an early example of the historical-diary novel.","slug":"tanska-hoffman-klementyna"},{"name":"Rychlowska, Marianna","role":"Introduction by","bio":null,"slug":"rychlowska-marianna"}],"slug":"the-journal-of-countess-francoise-krasinska","uk_list":"10.95","aus_list":"17.95","eur_list":"12.95"},{"isbn":"9780987276049","title":"The Artist as Mystic: Conversations with Yahia Lababidi","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"86","bisac":"ART / General","full_description":"The Artist as Mystic is a set of lyric conversations between aphorists Yahia Lababidi and Alex Stein. These conversations constitute what Australians call a 'Songline'-a set of sacred songs that allow the reader/listener to navigate through an unknown terrain in this case populated by tortured and ecstatic souls: Kafka Baudelaire Nietzsche Rilke Kierkegaard and Ekelund.\nThese visionaries are masterfully evoked in this very fine work of biography and criticism. But these writings are more than the sum of notes on a page they are song. The Artist as Mystic passes the test of all great writing not only to delight but to leave us knowing something of the subject and ourselves that we hadn't considered before.","short_description":"In a sequence of lyric conversations, aphorists Alex Stein and Yahia Lababidi summon the tortured, ecstatic spirits of Kafka, Baudelaire, Nietzsche, Rilke and Kierkegaard. Part biography, part criticism, part incantation, it reads like a songline through the modern soul.","keywords":"lyric conversations on art and creativity; two aphorists in dialogue; Kafka, Rilke, Nietzsche and Baudelaire; the artist as visionary and mystic; essays on poetry and the imagination; meditations on the creative soul","review_quotes":null,"us_list":"15.95","contributors":[{"name":"Stein, Alex","role":"Author","bio":"Alex Stein is an American essayist, aphorist and illustrator. His books include Made-Up Interviews with Imaginary Artists (Ugly Duckling Presse, 2009) - a genre-blurring collection of interviews, interview fictions and essays on the art of the interview - and Weird Emptiness: Essays and Aphorisms (Wings Press, 2007). He lives in Boulder and works at the University of Colorado.","slug":"stein-alex"},{"name":"Lababidi, Yahia","role":"Author","bio":"Yahia Lababidi is an Egyptian-American poet, essayist and aphorist, the author of some sixteen books of poetry and prose. His first collection of aphorisms, Signposts to Elsewhere, was named a 2008 Book of the Year by The Independent (UK), and his work appears in World Literature Today, AGNI and Philosophy Now, as well as in Geary's Guide to the World's Great Aphorists. In 2012 he served as a juror for the Neustadt Prize, one of the most prestigious international literary awards.","slug":"lababidi-yahia"}],"slug":"the-artist-as-mystic-conversations-with-yahia-lababidi","uk_list":"11.95","aus_list":"20.95","eur_list":"14.95"},{"isbn":"9780987153265","title":"Oriental Encounters","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"222","bisac":"HISTORY / General","full_description":"In 1896 Marmaduke Pickthall arrived in Palestine and spent the next couple of years in native dress wandering the hinterlands. English expatriates were alarmed the young man had gone native but Marmaduke was having the time of his life.He said \"'When I read The Arabian Nights I see the daily life of Damascus Jerusalem Aleppo Cairo and the other cities as I found it in the early nineties of last century. What struck me even in its decay and poverty was the joyousness of that life compared with anything that I had seen in Europe. The people seemed quite \nindependent of our cares of life our anxious clutching after wealth our fear of death.'\n\n In Oriental Encounters he records his meetings with a passing parade \n of chiefs bandits and madmen engaged in the joyousness of life.","short_description":"In 1896 the young Englishman Marmaduke Pickthall shed his expatriate world and wandered Palestine and Syria in native dress. His vivid, affectionate record finds a Near East freer and more joyous than anything he had known in Europe.","keywords":"an Englishman in the Ottoman Near East; travels in Palestine and Syria; going native in the 1890s; a memoir of the Arab world; East and West before the Great War; Marmaduke Pickthall","review_quotes":null,"us_list":"18.95","contributors":[{"name":"Pickthall, Marmaduke","role":"Author","bio":"Marmaduke Pickthall (1875-1936) was an English novelist, journalist and traveller, later celebrated for his translation The Meaning of the Glorious Koran (1930). Born in London, he travelled extensively in the Near East as a young man and converted to Islam in 1917. His fiction and memoirs drew on a deep sympathy for Arab and Ottoman life.","slug":"pickthall-marmaduke"}],"slug":"oriental-encounters","uk_list":"14.95","aus_list":"27.95","eur_list":"17.95"},{"isbn":"9780987276070","title":"Beauty on Earth","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"224","bisac":"FICTION / Literary","full_description":"Through the door of a Swiss inn the reader steps into a painting. Two men talk to each other and before long the writer -someone like them one of them- begins to address us. Thus commences the fugue that is Beauty on Earth in which the coming of a beautiful orphan to her uncle's inn brings a gradual chaos upon his town. Swiss novelist Charles-Ferdinand Ramuz published La Beauté in 1927. This translation by Michelle Bailat-Jones is a gift for which English language readers have waited decades.","short_description":"The arrival of a beautiful orphan at her uncle's lakeside inn sends a slow, dreamlike chaos rippling through a Swiss village. In Ramuz's incantatory 1927 novel, beauty itself becomes an almost elemental, disruptive force.","keywords":"Swiss literary fiction in translation; a beautiful orphan disrupts a lakeside village; Charles-Ferdinand Ramuz in English; a lyrical modernist novel; desire and chaos in a small town; French-Swiss literature; Lake Geneva village life","review_quotes":"<p>\"This is an astonishing novel. I speak nothing but ordering-in-a-restaurant / booking-a-hotel-room French so I can only think that Michelle Bailat-Jones the translator is a poet as well as - obviously - a fluent French speaker because this novel which I read in her translation <em> reads like liquid music</em>.\"</p>","us_list":"18.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Bailat-Jones, Michelle","role":"Translator","bio":"Michelle Bailat-Jones is a writer and translator. Born in Japan and raised in the Pacific Northwest, she lives in Switzerland, of which she is now a citizen, and holds an MFA from Emerson College. Her debut novel Fog Island Mountains won the 2013 Christopher Doheny Award from the Center for Fiction; her second, Unfurled, appeared in 2018. She is Translations Editor at Necessary Fiction, and beyond her two Ramuz novels for Skomlin she has translated Claude Cahun and, for Bloomsbury, Corinne Chaponniere's biography of Red Cross founder Henry Dunant.","slug":"bailat-jones-michelle"},{"name":"Trueblood, Valerie","role":"Foreword by","bio":null,"slug":"trueblood-valerie"}],"slug":"beauty-on-earth","uk_list":"13.95","aus_list":"27.95","eur_list":"17.95"},{"isbn":"9780987276056","title":"The Reign of the Evil One","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"134","bisac":"FICTION / Literary","full_description":"On a quiet summer evening in a Swiss mountain village a stranger comes to stay; the generous ever helpful shoemaker Branchu. All who did business with him profited very well by the exchange. Only the insane and ultimately hapless Luc was never fooled.\nIn masterful strokes the Swiss writer Charles Ferdinand Ramuz unleashes an apocalyptic fantasia and gives us a remarkable epic fable.","short_description":"A generous stranger settles in a quiet mountain village, and all who deal with him prosper - all but the one fool who sees him clearly. Ramuz turns a simple fable into an apocalyptic fantasia of good, evil and rural dread.","keywords":"a Swiss mountain village fable; a sinister stranger arrives; an apocalyptic fantasia; good and evil in the Alps; a folk-tale of temptation and ruin; Charles-Ferdinand Ramuz in English","review_quotes":null,"us_list":"16.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Whitall, James","role":"Translator","bio":"James Whitall (b. 1888) was an American writer and translator, author of the memoir English Years (1935) and translator of Chinese Lyrics from the Book of Jade (1918) and Pierre Hamp's People. His 1922 translation of The Reign of the Evil One (Harcourt, Brace) was the first of Ramuz's books to appear in English; this edition carries an introduction by the critic Ernest Boyd.","slug":"whitall-james"},{"name":"Boyd, Ernest","role":"Introduction by","bio":null,"slug":"boyd-ernest"}],"slug":"the-reign-of-the-evil-one","uk_list":"12.95","aus_list":"21.95","eur_list":"14.95"},{"isbn":"9780987401434","title":"Riversong of the Rhône","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"104","bisac":"TRAVEL / Europe / Switzerland","full_description":"\"One sings here of the soul of a river and this soul never dies.\" C.F.Ramuz\n\nNearly seventy years after the death of Charles Ferdinand Ramuz (1878-1947) it is safe to say that the reputation of Switzerland's legendary poet of the people is secure at least in French. Since 2005 his 22 novels have appeared in a two-volume Pléiade Edition from Gallimard (Paris) and Éditions Slatkine in Geneva has completed 29 volumes of Ramuz's Oeuvres Complètes (Complete Works). The author's slightly blurred face has been on the Swiss 200-franc note for years and his Histoire du Soldat (A Soldier's Tale) written in collaboration with Igor Stravinksy in 1918 can easily be found on You Tube. But only recently have English translations of Ramuz's novels begun to appear and until now his only epic prose poem has not been available in English. \n\nPatti M. Marxsen's translation of Ramuz's Chant de Notre Rhône brings this unique work to Anglophone readers as Riversong of the Rhone in a well-crafted bilingual edition that is ideal for students as well as general readers of poetry. Part ode to nature part assertion of human freedom part celebration and entirely pure delight in language made musical Marxsen's Riversong promises to be as enduring as the river and the landscape it describes.\n\n\"Riversong of the Rhone is fueled by an entrancing hymn-like music. Patti Marxsen's agile translation of the poem reveals a musicality within incantatory repetitions and images of a rocking cradle-an aural and visual evocation of a shared birthplace.\" -Jennifer Kurdyla Music & Literature\n\n\"Marxsen has taken the French lyrical prose and transformed it into English lyrical prose.\" - From the Foreword by Susan M. Tiberghien","short_description":"\"One sings here of the soul of a river, and this soul never dies.\" Ramuz follows the Rhone from the Alps to the sea in a lyrical hymn to the river and the people who live along its banks.","keywords":"the soul of a river; a hymn to the Rhone; from the Alps to the sea; the poet of the people; Charles-Ferdinand Ramuz lyric prose; landscape, memory and place","review_quotes":"<p><em>Riversong of the Rhone</em> is a beautiful book. And still more beautiful if we take the time to listen to it as well as to read it. To listen to the song of the river. It is the music that turns the pages that tunes the heart of the reader to the beauty of the words. To the beauty of the Rhone River and its riversides the home of the author—and composer—C.F. Ramuz.<em>Riversong of the Rhone</em> is a beautiful book. And still more beautiful if we take the time to listen to it as well as to read it. To listen to the song of the river. It is the music that turns the pages that tunes the heart of the reader to the beauty of the words. To the beauty of the Rhone River and its riversides the home of the author—and composer—C.F. Ramuz.</p>","us_list":"16.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Marxsen, Patti M","role":"Translator","bio":"Patti M. Marxsen is an American essayist, biographer and translator whose work has appeared in Asymptote, The French Review and the Women's Review of Books. Her critical biography Jacques Roumain: A Life of Resistance won the 2019 Haitian Studies Association Book Prize, and her essay 'Gateau de Payerne' took the inaugural Geneva Writers' Group Literary Award for Non-Fiction. A devotee of Ramuz during her years in Switzerland, she has translated both his prose-poem Riversong of the Rhone and the novel Passage of the Poet. This bilingual edition carries a foreword by Susan Tiberghien.","slug":"marxsen-patti-m"},{"name":"Tiberghien, Susan","role":"Foreword by","bio":null,"slug":"tiberghien-susan"}],"slug":"riversong-of-the-rho-ne","uk_list":"11.95","aus_list":"20.95","eur_list":"14.95"},{"isbn":"9780987401472","title":"What if the sun...","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"178","bisac":"FICTION / Literary","full_description":"What might the end of the world look like to people who inhabit high mountains whose lives are governed by the dependable revolution of the seasons? Perhaps the sun might slip beneath a western ridge one evening and not return in the morning. \n\nIn the first half of the 20th century that terrifying prospect represented a mild version of hell. Real hell would be knowing in advance that it was going to happen. \n\nAnd so revisiting a theme that Charles Ferdinand Ramuz had explored many times before in his fiction-notably in a short story that he wrote in 1912 on the eve of another war-he bestowed upon the villagers of Upper Saint-Martin the dreadful knowledge that the sun was sick and would soon expire leaving them to die alone in the cold and the dark.\n\nThe prophecy falls from the lips of the village sage and healer Antoine Anzévui. The weather seems to bear him out. But the sun abandons those parts for a few months every year so to accept the prophecy means to have faith in the prophet-to believe him when he says that the life-giving star won't return as expected in the spring.\n\nWhat holds for Upper Saint-Martin holds for the rest of the world because in Ramuz's novels the village is the world and the world is the village\n\nWritten in Fench as Si le soleil ne revenait pas and translated into English for the first time by Michelle Bailt-Jones here are both the 1912 short story and the 1937 novel - What if the sun...","short_description":"What would the end of the world look like to people whose lives turn on the certainty of the seasons? When the sun fails to rise over their alpine valley, the villagers of Upper Saint-Martin must live out their final days knowing the worst.","keywords":"the end of the world in the mountains; the sun fails to rise; an alpine apocalypse; villagers facing the last days; existential dread in the Alps; Charles-Ferdinand Ramuz","review_quotes":null,"us_list":"18.95","contributors":[{"name":"Ramuz, Charles Ferdinand","role":"Author","bio":"Charles-Ferdinand Ramuz (1878-1947) was a French-language Swiss novelist and poet, born in Lausanne, in the canton of Vaud. Writing in a distinctive, incantatory prose rooted in the landscape and peasantry of French-speaking Switzerland, he became the central figure of Suisse romande literature; his portrait later appeared on the Swiss 200-franc banknote, and his Histoire du soldat (1918) was written in collaboration with Igor Stravinsky. Skomlin publishes six of his novels in English translation: Beauty on Earth, The Reign of the Evil One, Riversong of the Rhone, What if the sun..., Derborence, and Farinet's Gold.","slug":"ramuz-charles-ferdinand"},{"name":"Bailat-Jones, Michelle","role":"Translator","bio":"Michelle Bailat-Jones is a writer and translator. Born in Japan and raised in the Pacific Northwest, she lives in Switzerland, of which she is now a citizen, and holds an MFA from Emerson College. Her debut novel Fog Island Mountains won the 2013 Christopher Doheny Award from the Center for Fiction; her second, Unfurled, appeared in 2018. She is Translations Editor at Necessary Fiction, and beyond her two Ramuz novels for Skomlin she has translated Claude Cahun and, for Bloomsbury, Corinne Chaponniere's biography of Red Cross founder Henry Dunant.","slug":"bailat-jones-michelle"},{"name":"Spinney, Laura","role":"Foreword by","bio":null,"slug":"spinney-laura"}],"slug":"what-if-the-sun","uk_list":"13.95","aus_list":"24.95","eur_list":"16.95"},{"isbn":"9780987401403","title":"Countess Cosel","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"248","bisac":"FICTION / Historical / General","full_description":"<p>Born Anna Constantia von Brockdorff in 1680 this German noblewoman rose from a minor lady-in-waiting to become the mistress of the King of Poland and finally the most famous prisoner in Saxony.</p><p>In her youth she had an affair and the scandal was covered up.  Then she made a respectable marriage but that proved inconvenient once she caught the King’s attention.  She withstood his advances until she had gained everything; title position and power. But in the process she made enemies who would one day prevail against her.</p><p>Her fate was to be 49 years a prisoner never giving the King the one thing he desperately wanted.  In doing so she chose death in prison over freedom.</p>","short_description":"Born Anna Constantia von Brockdorff this German noblewoman rose from lady-in-waiting to mistress of the King of Poland. Her fate was to be 49 years a prisoner never giving the King the one thing he desperately wanted.  In doing so she chose death in prison over freedom.","keywords":"Saxon court intrigue; the king's fallen favourite; Augustus the Strong's mistress; a woman imprisoned for love; historical fiction of old Poland and Dresden; Jozef Ignacy Kraszewski","review_quotes":null,"us_list":"20.95","contributors":[{"name":"Kraszewski, Józef Ignacy","role":"Author","bio":"Jozef Ignacy Kraszewski (1812-1887) was among the most prolific writers in literary history, author of more than 200 novels alongside plays, poetry and historical studies. A Polish novelist, journalist and political activist, he travelled across pre-partition Poland and much of Europe, and is celebrated above all for his cycle of historical novels. Skomlin also publishes Kraszewski's Count Bruhl.","slug":"kraszewski-j-zef-ignacy"},{"name":"de Savoy-Carignan, Guy Jean Raoul Eugè","role":"Translator","bio":null,"slug":"de-savoy-carignan-guy-jean-raoul-euge"}],"slug":"countess-cosel","uk_list":"16.95","aus_list":"28.95","eur_list":"17.95"},{"isbn":"9780987401410","title":"Count Brühl","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"256","bisac":"FICTION / Historical / General","full_description":"<p>Count Henryk Brühl <em>(1700–1763)</em> was a statesman at the court of Saxony and the Polish–Lithuanian Commonwealth who rose meteorically from a Dowager Countess’ page to Prime Minister of the King. With determination and ruthless cunning he managed to despatch his rivals and control the King and through him Saxony and Poland. He was the presiding genius of the regime much like Thomas Cromwell to Henry the VIII.</p><p>But his ambition and greed exceeded his political ability and finally left the country bankrupt and utterly unprepared to face the attacks of the Prussian king.</p><p><strong>This is the story of the rise and fall of one of history’s forgotten legends.</strong></p>","short_description":"Count Henryk Brühl was a statesman at the court of Poland and Saxony. With skill and ruthless cunning he dispatched his rivals and gain control of the King and Poland. \nHis ambition and greed exceeded his political ability and left the country bankrupt and utterly unprepared to resist the attacks of the Prussian king.","keywords":"intrigue at the Saxon court; the rise of a ruthless minister; Augustus III's Poland; power, ambition and betrayal; Dresden and Warsaw in the 18th century; Jozef Ignacy Kraszewski","review_quotes":null,"us_list":"21.95","contributors":[{"name":"Kraszewski, Józef Ignacy","role":"Author","bio":"Jozef Ignacy Kraszewski (1812-1887) was among the most prolific writers in literary history, author of more than 200 novels alongside plays, poetry and historical studies. A Polish novelist, journalist and political activist, he travelled across pre-partition Poland and much of Europe, and is celebrated above all for his cycle of historical novels. Skomlin also publishes Kraszewski's Countess Cosel.","slug":"kraszewski-j-zef-ignacy"},{"name":"de Savoy-Carignan, Guy Jean Raoul Eugè","role":"Translator","bio":null,"slug":"de-savoy-carignan-guy-jean-raoul-euge"}],"slug":"count-br-hl","uk_list":"14.95","aus_list":"29.95","eur_list":"18.95"},{"isbn":"9780648182627","title":"History of Australian Bushrangers: & The Jerilderie Letter","imprint":"Skomlin","series":null,"format":"Perfect Bound","page_count":"428","bisac":"HISTORY / Australia & New Zealand","full_description":"<p>The history of Australian and New Zealand Bushrangers from first settlement of Australia to the death of Ned Kelly in 1880.  Includes an extensive index of place and person names and the full transcript of Ned Kelly's famous Jerilderie Letter.</p>","short_description":"A history of Australian and New Zealand Bushrangers from first settlement of Australia to the death of Ned Kelly in 1880. Includes an extensive index of place and person names and the full transcript of Ned Kelly's famous Jerilderie Letter.","keywords":"the history of the Australian bushrangers; Ned Kelly and the Jerilderie Letter; colonial outlaws of the bush; convict-era crime in Australia; the Kelly Gang and Ben Hall; the true bushranging era","review_quotes":null,"us_list":"29.95","contributors":[{"name":"Boxall, George E","role":"Author","bio":"George E. Boxall was an English-born writer and journalist whose History of the Australian Bushrangers (first published 1899) became a standard early account of colonial outlawry. This edition appends The Jerilderie Letter (1879), Ned Kelly's own manifesto, dictated by the outlaw to explain and justify his campaign against the colonial authorities. [VERIFY: biographical detail on Boxall is limited.]","slug":"boxall-george-e"},{"name":"Kelly, Ned","role":"Author","bio":"Ned Kelly was born in 1854 in Victoria, the eldest son of an Irish convict transported for pig stealing. He grew up poor in the ranges north of Melbourne, in a community of selectors — small farmers — who had little standing against squatters and less trust in the colonial police. His father died when Ned was twelve. By his mid-teens he was already known to police, apprenticed briefly to the bushranger Harry Power, and cycling through charges. A confrontation with Constable Fitzpatrick in 1878 — disputed then, disputed still — sent him and his brother Dan into the bush for good. The Kelly Gang killed 3 policemen at Stringybark Creek, robbed banks at Euroa and Jerilderie, and held a town at gunpoint at Glenrowan. Kelly walked into the troopers' rifles in homemade plate armour and was captured, tried, and hanged in Melbourne on 11 November 1880. He was 25.\n\nDuring the Jerilderie bank raid in February 1879, Kelly dictated a 7,500-word document to Joe Byrne and demanded it be printed in the local paper. It wasn't — not in his lifetime. The letter is a furious, vernacular indictment of the colonial system: the police who harassed his family, the squatters who held the land, and the courts that served them both. The prose is raw and run-on, built from the rhythms of spoken Irish-Australian English rather than any schoolroom model. Kelly had almost no formal education. What he produced was closer to an oral manifesto than a written text. Scholars have read it as political philosophy, as self-justification, and as literature. It remains one of the most vivid documents the colonial period produced.","slug":"kelly-ned"}],"slug":"history-of-australian-bushrangers-the-jerilderie-letter","uk_list":"22.95","aus_list":"36.95","eur_list":"21.95"},{"isbn":"9780648238829","title":"Lady Macbeth of the Mzinsk District","imprint":"Skomlin","series":"Fabulous Novellas","format":"Perfect Bound","page_count":"70","bisac":"FICTION / General","full_description":"<p>Katerina is stifled by her loveless marriage to a bitter man twice her age whose family are cold and unforgiving. When she embarks on a passionate affair with a young worker on her husband's estate a force is unleashed inside her so powerful that she will stop at nothing to get what she wants.</p><p>Leskov's wrote the novella in the Kiev university's punishment room. He described how his hair stood on end as he worked on it alone in that cold place and swore he would never describe such horrors again. It was published in Dostoyevsky's Epoch magazine in 1865 and is a picture of almost unrelieved wickedness and passion. Ignored at first by contemporaries it is now regarded as a masterpiece.</p>","short_description":"Katerina is stifled by her loveless marriage to a bitter man twice her age whose family are cold and unforgiving. When she embarks on a passionate affair with a young worker on her husband's estate a force is unleashed inside her so powerful that she will stop at nothing to get what she wants.","keywords":"a merchant's wife driven to murder; passion and crime in provincial Russia; the basis for Shostakovich's opera; a fatal love affair; Russian literary tragedy; Nikolai Leskov","review_quotes":null,"us_list":"12.95","contributors":[{"name":"Leskov, Nikolai","role":"Author","bio":"Nikolai Leskov (1831-1895) was a Russian novelist, short-story writer and journalist, admired by Chekhov and Gorky for his mastery of vernacular Russian and his vivid portraits of provincial and clerical life. Born in Gorokhovo, Oryol Province, he drew on wide travels across Russia; his tale Lady Macbeth of the Mtsensk District later inspired Shostakovich's opera. Skomlin also publishes Leskov's Cross-eyed Lefty and the Steel Flea.","slug":"leskov-nikolai"},{"name":"Chamot, Alfred","role":"Translator","bio":null,"slug":"chamot-alfred"}],"slug":"lady-macbeth-of-the-mzinsk-district","uk_list":"9.95","aus_list":"17.95","eur_list":"12.95"},{"isbn":"9780648182658","title":"Cross-eyed Lefty and the Steel Flea","imprint":"Skomlin","series":"Fabulous Novellas","format":"Perfect Bound","page_count":"56","bisac":"FICTION / General","full_description":"<p>Tsar Alexander I of Russia while visiting England with his servant Platov is shown a number of impressive modern inventions. Platov insists that things in Russia are much better but then they are shown a mechanical flea as small as a crumb with a key to wind it up that can only be seen through a microscope. Nicolas orders Platov to find a Russian to beat the English at this game and Platov travels to Tula to find a gunsmith to do the job.</p><p>This novella is a gem of Russian literature. It is one of Leskov’s finest works and marks him as ingenious storyteller and stylistic virtuoso.</p>","short_description":"Tsar Alexander I of Russia while visiting England with his servant Platov is shown a number of impressive modern inventions. When they are shown a mechanical flea as small as a crumb with a key to wind it up that can only be seen through a microscope Nicolas orders Platov to find a Russian to beat the English at this game.","keywords":"a Russian craftsman's tall tale; the flea shod in steel; folk satire of tsarist Russia; skaz storytelling; Tula gunsmiths and imperial pride; Nikolai Leskov","review_quotes":null,"us_list":"12.95","contributors":[{"name":"Leskov, Nikolai","role":"Author","bio":"Nikolai Leskov (1831-1895) was a Russian novelist, short-story writer and journalist, admired by Chekhov and Gorky for his mastery of vernacular Russian and his vivid portraits of provincial and clerical life. Born in Gorokhovo, Oryol Province, he drew on wide travels across Russia; his tale Lady Macbeth of the Mtsensk District later inspired Shostakovich's opera. Skomlin also publishes Leskov's Lady Macbeth of the Mzinsk District.","slug":"leskov-nikolai"},{"name":"Hapgood, Isabel","role":"Translator","bio":null,"slug":"hapgood-isabel"}],"slug":"cross-eyed-lefty-and-the-steel-flea","uk_list":"9.95","aus_list":"15.95","eur_list":"12.95"},{"isbn":"9780648182672","title":"Siddhartha: An Indian Tale","imprint":"Skomlin","series":"Fabulous Novellas","format":"Perfect Bound","page_count":"128","bisac":"FICTION / Literary","full_description":"<p>This classic novel of self-discovery has inspired generations of seekers. With parallels to the enlightenment of the Buddha Hesse's Siddhartha is the story of a young Brahmin's quest for the ultimate reality. His quest takes him from the extremes of indulgent sensuality to the rigors of ascetism and self-denial. At last he learns that wisdom cannot be taught — it must come from one's own experience and inner struggle.</p>","short_description":"Siddhartha is the story of a young Brahmin's quest for the ultimate reality. His quest takes him from the extremes of indulgent sensuality to the rigors of ascetism and self-denial. At last he learns that wisdom cannot be taught - it must come from one's own experience and inner struggle.","keywords":"a young seeker's quest for enlightenment; spiritual awakening; Buddhist philosophy in fiction; the journey to inner wisdom; an Eastern spirituality classic; Hermann Hesse's Siddhartha","review_quotes":null,"us_list":"15.95","contributors":[{"name":"Hesse, Hermann","role":"Author","bio":"Hermann Hesse (1877-1962) was a German-born Swiss novelist, poet and painter, awarded the Nobel Prize in Literature in 1946. Born in Calw, Germany, and later a citizen of Switzerland, he wrote fiction preoccupied with the individual's search for authenticity and spiritual wholeness. His major works - Siddhartha (1922), Steppenwolf, Demian and The Glass Bead Game - drew on Indian and East Asian thought and made him one of the most widely read European authors of the twentieth century. Skomlin also publishes Hesse's The Journey to the East.","slug":"hesse-hermann"},{"name":"Rosner, Hilda","role":"Translator","bio":null,"slug":"rosner-hilda"}],"slug":"siddhartha-an-indian-tale","uk_list":"10.95","aus_list":"21.95","eur_list":"15.95"},{"isbn":"9780648182689","title":"The Journey to the East","imprint":"Skomlin","series":"Fabulous Novellas","format":"Perfect Bound","page_count":"70","bisac":"FICTION / Literary","full_description":"<p>In Journey to the East \"H. H.\" becomes a member of \"The League\" a timeless religious sect whose members include famous fictional and real characters such as Plato Mozart Pythagoras Paul Klee Don Quixote Puss in Boots Tristram Shandy Baudelaire Goldmund  and the ferryman Vasudeva. A branch of the group goes on a pilgrimage to the East in search of the Truth. The narrator speaks of travelling through both time and space across geography imaginary and real.</p><p>But soon the Journey runs into a crisis in a deep mountain gorge called Morbio Inferiore when Leo apparently a simple servant disappears causing the group to plummet into anxiety and argument.</p><p>Years later the narrator tries to write his story of the Journey even though he has lost contact with the group and believes the League no longer exists.   But the crisis in Morbio Inferiore was only a test of faith.</p>","short_description":"In Journey to the East \"H.H.\" becomes a member of \"The League\" a timeless religious sect whose members include famous fictional and real characters such as Plato Mozart Pythagoras Paul Klee Don Quixote Baudelaire Goldmund  and the ferryman Vasudeva. A branch of the group goes on a pilgrimage to the East in search of the Truth.","keywords":"a secret pilgrimage of the spirit; the League of seekers; an allegory of faith and memory; losing and finding belief; the journey to the East; Hermann Hesse","review_quotes":null,"us_list":"15.95","cont
